// ===========================================================================
// TRADE JOURNAL
//
// The part most retail tools leave out, and the part that actually compounds.
// Logging entries turns "I think I do okay" into a measured hit rate, average
// win, average loss, and expectancy — the numbers that tell you whether a
// strategy is working before your balance does.
// ===========================================================================
function logTrade(p,entryOverride,sizeOverride,paperMode){
  if(!p||!p._cv)return;
  var cv=p._cv, econ=p._econ;
  var t={
    id:String(Date.now())+"-"+Math.random().toString(36).slice(2,9),
    chain:p.chainId,
    addr:(p.baseToken&&p.baseToken.address)||"",
    pair:p.pairAddress||"",
    sym:(p.baseToken&&p.baseToken.symbol)||"?",
    paper:(paperMode!==false),
    blockedTest:!!(p._gate&&(p._gate.verdict==="block"||p._gate.verdict==="unverified")),
    remaining:1,
    // Fingerprint captured at entry, never afterwards. Recording what the
    // token looked like when you decided is the only way to learn anything
    // from the outcome — measuring it later would be hindsight.
    fp:(function(){
      var f=(cv&&cv.f)||{};
      var fdv=num(p.fdv||p.marketCap), liq=num(p.liquidity&&p.liquidity.usd);
      var age=ageH(p.pairCreatedAt);
      return {
        grade:cv?cv.grade:"?", score:cv?cv.total:0,
        chain:p.chainId||"?",
        heat:(p._heat&&p._heat.score)||null,
        fdv:fdv, fdvBand: fdv<100000?"<100K": fdv<500000?"100K-500K": fdv<2000000?"500K-2M": fdv<10000000?"2M-10M":">10M",
        liqRatio: fdv>0?liq/fdv:0,
        ageH: age, ageBand: age==null?"?": age<6?"<6h": age<24?"6-24h": age<72?"1-3d": age<336?"3-14d":">14d",
        verdict:(p._gate&&p._gate.verdict)||"?",
        dumpFlags:(p._dump&&p._dump.flags.filter(function(x){return x.s!=="ok";}).length)||0,
        profile:(function(){var pm=profileMatch(p);return pm?pm.n:null;})(),
        accel:Math.round(f.accel||0), turn:Math.round(f.turn||0), room:Math.round(f.room||0),
        flow:Math.round(f.flow||0), liqF:Math.round(f.liq||0), dist:Math.round(f.dist||0)
      };
    })(),
    events:[],
    peak:0,
    entry:(entryOverride!=null&&isFinite(entryOverride)&&entryOverride>0)?entryOverride:num(p.priceUsd),
    size:(sizeOverride!=null&&isFinite(sizeOverride)&&sizeOverride>0)?sizeOverride:S.cfg.sizeUsd,
    stopPct:S.cfg.stopPct,
    tps:S.cfg.tp.slice(),
    grade:cv?cv.grade:"?",
    score:cv?cv.total:0,
    costs:econ?econ.totalUsd:0,
    opened:Date.now(),
    status:"open",
    exit:null, exitAt:null, pnl:null, note:""
  };
  S.trades.unshift(t);
  saveTrades();
  S.journalNote="Logged "+t.sym+" at "+px(t.entry)+" \u2014 open it in the Journal tab to track it.";
  render();
}

function closeTrade(id,exitPrice){
  var t=null;
  for(var i=0;i<S.trades.length;i++) if(S.trades[i].id===id) t=S.trades[i];
  if(!t)return;
  exitPrice=num(exitPrice);
  if(exitPrice<=0){S.journalNote="Enter the price you actually sold at.";render();return;}
  var mult=t.entry>0?exitPrice/t.entry:0;
  var gross=t.size*(mult-1);
  t.exit=exitPrice; t.exitAt=Date.now(); t.status="closed";
  t.pnl=gross-t.costs;              // net of the fees this trade cost
  saveTrades(); render();
}

function deleteTrade(id){
  S.trades=S.trades.filter(function(t){return t.id!==id;});
  saveTrades();render();
}

// Live prices for open positions, so the journal shows where you actually are.
// ===========================================================================
// PAPER TRADE AUTO-RESOLUTION
//
// A logged paper trade plays itself out. Every price update it is checked
// against the stop and the take-profit ladder that were set at entry, and
// partial exits are executed exactly as the plan says — sell 50% at 2x, 25%
// of what's left at 4x, and so on. The point is to find out what your rules
// would actually have produced, with no hindsight and no discretion.
// ===========================================================================
function resolvePaper(t,price){
  if(!t.paper||t.status!=="open"||!isFinite(price)||price<=0||!t.entry)return false;
  var changed=false;
  var mult=price/t.entry;
  if(mult>t.peak)t.peak=mult;

  var stop=t.entry*(1-t.stopPct/100);

  // Stop first — if both a target and the stop are hit between updates, the
  // pessimistic read is the honest one.
  if(price<=stop){
    // Fill AT the stop level, exactly as the plan states — same rule the
    // take-profit rungs use. Note this is the optimistic reading: a real
    // stop on a DEX often fills below the level during a fast drop, since
    // you are selling manually into a falling market. Paper results here
    // are therefore a best case on the downside.
    var soldFrac=t.remaining;
    var fillPrice=stop;
    var proceeds=t.size*soldFrac*(fillPrice/t.entry);
    var cost=t.size*soldFrac;
    t.realized=(t.realized||0)+(proceeds-cost);
    t.events.push({at:Date.now(),kind:"stop",price:fillPrice,pct:soldFrac*100,
      note:"Stop hit \u2014 sold remaining "+(soldFrac*100).toFixed(0)+"% at "+px(fillPrice)+
        " (\u2212"+t.stopPct+"% from entry)"});
    t.remaining=0;t.status="closed";t.exitAt=Date.now();t.exit=fillPrice;
    t.pnl=(t.realized||0)-(t.costs||0);
    return true;
  }

  // Take-profit ladder, in order, each firing once
  var steps=t.tps.slice().sort(function(a,b){return a-b;});
  steps.forEach(function(m,idx){
    if(t.events.some(function(ev){return ev.kind==="tp"&&ev.mult===m;}))return;
    if(mult<m)return;
    // On the final rung the remainder is sold too. A runner left open forever
    // never resolves into a result, and the whole point here is to measure
    // what the rules produced.
    var isLast=idx===steps.length-1;
    var sellPct=isLast?100:(idx===0?50:25);
    var soldFrac=isLast?t.remaining:t.remaining*(sellPct/100);
    if(soldFrac<=0)return;
    var target=t.entry*m;
    var proceeds=t.size*soldFrac*m;      // filled at the target price
    var cost=t.size*soldFrac;
    t.realized=(t.realized||0)+(proceeds-cost);
    t.remaining-=soldFrac;
    t.events.push({at:Date.now(),kind:"tp",mult:m,price:target,pct:sellPct,
      note:"Hit "+m+"x \u2014 sold "+(isLast?"the remaining "+(soldFrac*100).toFixed(0)+"%":sellPct+"% of what was left")+
        " for "+usd(t.size*soldFrac*m)});
    changed=true;
  });

  // All targets taken: close it out
  if(t.remaining<=0.001&&t.status==="open"){
    var lastTarget=t.entry*steps[steps.length-1];
    t.status="closed";t.exitAt=Date.now();t.exit=lastTarget;
    t.pnl=(t.realized||0)-(t.costs||0);
    t.events.push({at:Date.now(),kind:"done",price:price,note:"Every target reached \u2014 position fully closed"});
    changed=true;
  }
  return changed;
}

// Runs on every price update, across every open paper trade.
function resolveAllPaper(){
  var any=false;
  S.trades.forEach(function(t){
    if(!t.paper||t.status!=="open")return;
    var k=liveKey(t.chain,t.addr);
    var lp=(LIVE.prices[k]||{}).px||t.live;
    if(lp&&resolvePaper(t,lp))any=true;
  });
  if(any)saveTrades();
  return any;
}

function refreshTrades(){
  if(IS_LOCAL_FILE){S.localBlocked=true;render();return;}
  var open=S.trades.filter(function(t){return t.status==="open";});
  if(!open.length){render();return;}
  S.tradesLoading=true;render();
  var pending=open.length;
  open.forEach(function(t){
    fetchJSON(DS+"/latest/dex/tokens/"+encodeURIComponent(t.addr))
      .then(function(d){
        var pairs=(d&&d.pairs)||[];
        if(pairs.length){
          pairs.sort(function(a,b){return num(b.liquidity&&b.liquidity.usd)-num(a.liquidity&&a.liquidity.usd);});
          t.live=num(pairs[0].priceUsd);
          t.liveAt=Date.now();
        }
      })
      .catch(function(){})
      .then(function(){ if(--pending<=0){S.tradesLoading=false;resolveAllPaper();render();} });
  });
}

// Aggregate performance. Expectancy is the number that matters: average
// dollars per trade. Positive means the approach pays over repetition.
function journalStats(mode){
  var closed=S.trades.filter(function(t){
    if(t.status!=="closed")return false;
    if(mode==="paper")return t.paper===true;
    if(mode==="real")return t.paper!==true;
    return true;
  });
  if(!closed.length)return null;
  var wins=closed.filter(function(t){return t.pnl>0;});
  var losses=closed.filter(function(t){return t.pnl<=0;});
  var sum=function(a){return a.reduce(function(x,t){return x+t.pnl;},0);};
  var totalPnl=sum(closed);
  var avgWin=wins.length?sum(wins)/wins.length:0;
  var avgLoss=losses.length?sum(losses)/losses.length:0;
  var winRate=(wins.length/closed.length)*100;
  var expectancy=totalPnl/closed.length;
  var totalFees=closed.reduce(function(x,t){return x+(t.costs||0);},0);
  // by grade, so you learn which grades are actually working for you
  var byGrade={};
  closed.forEach(function(t){
    var g=t.grade||"?";
    byGrade[g]=byGrade[g]||{n:0,pnl:0,w:0};
    byGrade[g].n++; byGrade[g].pnl+=t.pnl; if(t.pnl>0)byGrade[g].w++;
  });
  return {n:closed.length,open:S.trades.length-closed.length,wins:wins.length,
    losses:losses.length,winRate:winRate,avgWin:avgWin,avgLoss:avgLoss,
    totalPnl:totalPnl,expectancy:expectancy,totalFees:totalFees,byGrade:byGrade};
}

// ===========================================================================
// EXIT ALERTS
//
// Picking is the part everyone focuses on; exiting is the part that decides
// the return. This polls your open positions on a timer and alerts the moment
// one hits its stop or a target, so a plan made calmly at entry is the one
// that actually executes — rather than a decision made mid-move.
//
// Runs only while this tab is open. There is no server, so it cannot notify
// you when the page is closed.
// ===========================================================================
function requestNotify(){
  try{
    if(typeof Notification==="undefined"){S.journalNote="This browser can't show notifications. Alerts will still appear in the app.";render();return;}
    Notification.requestPermission().then(function(p){
      S.notifOk=(p==="granted");
      S.journalNote=S.notifOk?"Notifications on. Keep this tab open and you'll get alerted at your stop and targets."
        :"Notifications declined — alerts will still show inside the app while it's open.";
      render();
    });
  }catch(e){}
}

function pushAlert(kind,t,price,msg){
  var key=t.id+":"+kind;
  if(t._fired&&t._fired[key])return;          // never alert the same event twice
  t._fired=t._fired||{};t._fired[key]=1;saveTrades();

  S.alerts.unshift({id:Math.random(),kind:kind,sym:t.sym,msg:msg,at:Date.now()});
  if(S.alerts.length>25)S.alerts.length=25;

  if(S.notifOk){
    try{ new Notification("RibbitPad — "+t.sym, {body:msg, tag:key}); }catch(e){}
  }
  try{
    // short audible cue; harmless if the browser blocks it
    var AC=window.AudioContext||window.webkitAudioContext;
    if(AC){var c=new AC(),o=c.createOscillator(),g=c.createGain();
      o.connect(g);g.connect(c.destination);
      o.frequency.value=kind==="stop"?300:660;g.gain.value=0.07;
      o.start();setTimeout(function(){o.stop();c.close();},kind==="stop"?450:220);}
  }catch(e){}
}

// Alerts are written as instructions, not status updates. Each one states the
// action, the amount, the price, and the reason — so it can be acted on
// without any further thinking. They execute the plan the user set at entry.
function checkAlerts(){
  S.trades.forEach(function(t){
    if(t.status!=="open"||!t.live||!t.entry)return;
    var stop=t.entry*(1-t.stopPct/100);
    var pct=((t.live-t.entry)/t.entry)*100;
    var value=t.size*(t.live/t.entry);

    if(t.live<=stop){
      pushAlert("stop",t,t.live,
        "\ud83d\udd34 SELL ALL NOW at "+px(t.live)+". Down "+pct.toFixed(0)+"% \u2014 past the "+
        t.stopPct+"% stop you set. Position is worth "+usd(value)+" of your "+usd(t.size)+
        ". Selling here caps the loss at about "+usd(t.size-value)+".");
      return;
    }
    if(pct<=-(t.stopPct*0.7))
      pushAlert("near",t,t.live,
        "\u26a0\ufe0f GET READY TO SELL. Down "+pct.toFixed(0)+"%, your stop is "+px(stop)+
        " \u2014 about "+Math.abs(((t.live-stop)/t.live)*100).toFixed(0)+"% further down. Decide now, not then.");

    var mult=t.live/t.entry;
    var steps=t.tps.slice().sort(function(a,b){return a-b;});
    steps.forEach(function(m,idx){
      if(mult<m)return;
      var sellPct=idx===0?50:(idx===1?25:25);
      var cashOut=value*(sellPct/100);
      var keeping=100-sellPct;
      pushAlert("tp"+m,t,t.live,
        "\ud83d\udfe2 SELL "+sellPct+"% of what's left, NOW, at "+px(t.live)+". Hit your "+m+
        "x target \u2014 that takes about "+usd(cashOut)+" off the table"+
        (idx===0?" (roughly your original "+usd(t.size)+" back)":"")+
        ". Keep the other "+keeping+"% running toward "+
        (steps[idx+1]?steps[idx+1]+"x":"whatever it gives you")+".");
    });
  });
}

function startWatching(){
  if(S.watching)return;
  S.watching=true;
  var tick=function(){
    if(!S.watching)return;
    refreshTradesQuiet().then(function(){checkAlerts();render();});
  };
  tick();
  S.watchTimer=setInterval(tick,60000);   // once a minute is plenty and stays under rate limits
  render();
}
function stopWatching(){
  S.watching=false;
  if(S.watchTimer)clearInterval(S.watchTimer);
  S.watchTimer=null;render();
}

// price refresh without the loading spinner, for background polling
function refreshTradesQuiet(){
  var open=S.trades.filter(function(t){return t.status==="open";});
  if(!open.length)return Promise.resolve();
  return Promise.all(open.map(function(t){
    return fetchJSON(DS+"/latest/dex/tokens/"+encodeURIComponent(t.addr))
      .then(function(d){
        var pairs=(d&&d.pairs)||[];
        if(pairs.length){
          pairs.sort(function(a,b){return num(b.liquidity&&b.liquidity.usd)-num(a.liquidity&&a.liquidity.usd);});
          t.live=num(pairs[0].priceUsd);t.liveAt=Date.now();
        }
      }).catch(function(){});
  }));
}

// ===========================================================================
// RISK GUARD — exposure and loss limits.
// Position sizing is what separates a losing streak from a wipeout.
// ===========================================================================
function riskStatus(){
  var open=S.trades.filter(function(t){return t.status==="open";});
  var exposure=open.reduce(function(a,t){return a+t.size;},0);
  var dayAgo=Date.now()-24*60*60*1000;
  var todayClosed=S.trades.filter(function(t){return t.status==="closed"&&t.exitAt>=dayAgo;});
  var todayPnl=todayClosed.reduce(function(a,t){return a+(t.pnl||0);},0);
  var atRisk=open.reduce(function(a,t){return a+t.size*(t.stopPct/100);},0);
  return {
    open:open.length, exposure:exposure, atRisk:atRisk,
    todayPnl:todayPnl, todayN:todayClosed.length,
    overPositions:open.length>S.cfg.maxOpenPositions,
    overExposure:exposure>S.cfg.maxExposureUsd,
    overLoss:todayPnl<=-Math.abs(S.cfg.dailyLossLimit)
  };
}

// ===========================================================================
// LEARNING FROM YOUR OWN RESULTS
//
// Groups your closed trades by the characteristics they had at entry and
// reports how each group actually performed. This is descriptive statistics
// on your own data — not a model, and not clever. Its usefulness depends
// almost entirely on sample size, so every conclusion here is gated behind
// a minimum count and labelled with how confident it can possibly be.
// ===========================================================================
var LEARN_MIN_BUCKET=4;    // below this a bucket is noise
var LEARN_MIN_TOTAL=15;    // below this no recommendations at all

function learnBuckets(){
  var closed=S.trades.filter(function(t){return t.status==="closed"&&t.fp&&isFinite(t.pnl);});
  if(!closed.length)return null;

  function group(keyFn,label){
    var m={};
    closed.forEach(function(t){
      var k=keyFn(t.fp); if(k==null||k==="?")return;
      m[k]=m[k]||{n:0,w:0,pnl:0};
      m[k].n++; if(t.pnl>0)m[k].w++; m[k].pnl+=t.pnl;
    });
    var rows=Object.keys(m).map(function(k){
      return {k:k,n:m[k].n,w:m[k].w,pnl:m[k].pnl,
        winRate:(m[k].w/m[k].n)*100, exp:m[k].pnl/m[k].n};
    }).filter(function(r){return r.n>=2;});
    rows.sort(function(a,b){return b.exp-a.exp;});
    return {label:label,rows:rows};
  }

  return {
    total:closed.length,
    byGrade:group(function(f){return f.grade;},"Grade at entry"),
    byChain:group(function(f){return f.chain;},"Chain"),
    byFdv:group(function(f){return f.fdvBand;},"Size when you bought"),
    byAge:group(function(f){return f.ageBand;},"Age when you bought"),
    byProfile:group(function(f){return f.profile==null?null:(f.profile>=5?"5-6 traits":f.profile>=3?"3-4 traits":"0-2 traits");},"Parabolic profile match"),
    byHeat:group(function(f){return f.heat==null?null:(f.heat>=60?"heat 60+":f.heat>=35?"heat 35-59":"heat <35");},"Heat score"),
    byVerdict:group(function(f){return f.verdict;},"Safety verdict")
  };
}

// Only produce advice where a bucket is both large enough and clearly
// different from the rest. Everything else stays silent.
function learnFindings(){
  var b=learnBuckets();
  if(!b||b.total<LEARN_MIN_TOTAL)return {ready:false,total:b?b.total:0,findings:[]};
  var out=[];

  function scan(gr,kind){
    var big=gr.rows.filter(function(r){return r.n>=LEARN_MIN_BUCKET;});
    if(big.length<2)return;
    var best=big[0], worst=big[big.length-1];
    if(best.exp<=0&&worst.exp<=0){
      out.push({tone:"bad",text:"Every "+gr.label.toLowerCase()+" group you have enough data on is losing money."});
      return;
    }
    if(best.exp>0&&worst.exp<0&&(best.exp-worst.exp)>Math.abs(worst.exp)*0.5){
      out.push({tone:"good",kind:kind,best:best.k,worst:worst.k,
        text:gr.label+": <b>"+esc(best.k)+"</b> is working ("+best.n+" trades, "+
          best.winRate.toFixed(0)+"% win, "+(best.exp>=0?"+":"")+usd(best.exp)+
          " each) while <b>"+esc(worst.k)+"</b> is not ("+worst.n+" trades, "+
          (worst.exp>=0?"+":"")+usd(worst.exp)+" each)."});
    }
  }
  scan(b.byGrade,"grade"); scan(b.byChain,"chain"); scan(b.byFdv,"fdv");
  scan(b.byAge,"age"); scan(b.byProfile,"profile"); scan(b.byHeat,"heat");
  return {ready:true,total:b.total,findings:out,buckets:b};
}

// Did rejecting these tokens actually help? Compares the paper-tested
// rejects against the ones that passed. This is the app grading itself.
function filterAuditHTML(){
  var closed=S.trades.filter(function(t){return t.status==="closed"&&isFinite(t.pnl);});
  var blocked=closed.filter(function(t){return t.blockedTest;});
  var passed=closed.filter(function(t){return !t.blockedTest;});
  if(blocked.length<3)
    return '<div class="banner info"><b>Is the filter right?</b><br><br>'+
      'When a token is blocked you can still paper-test it. Do that a few times and this compares '+
      'how the rejects performed against the ones that passed \u2014 it tells you whether the filter '+
      'is protecting you or costing you.<br><br>'+
      blocked.length+' rejected token'+(blocked.length===1?"":"s")+' tested so far. Needs 3.</div>';

  function avg(a){return a.length?a.reduce(function(x,t){return x+(t.size>0?t.pnl/t.size:0);},0)/a.length:0;}
  var bAvg=avg(blocked), pAvg=avg(passed);
  var bWin=blocked.filter(function(t){return t.pnl>0;}).length;
  var pWin=passed.filter(function(t){return t.pnl>0;}).length;
  var filterHelping=pAvg>bAvg;

  return '<div style="margin:16px 18px;border:1.5px solid '+(filterHelping?"var(--frog)":"var(--amber)")+
    ';border-radius:12px;overflow:hidden">'+
    '<div style="padding:13px 14px;background:rgba(255,255,255,.03);font-size:12.5px;text-transform:uppercase;'+
    'letter-spacing:.09em;font-weight:800;color:'+(filterHelping?"var(--frog)":"var(--amber)")+'">'+
    'Is the filter right?</div><div style="padding:14px">'+
    '<div class="fac" style="padding-left:0;padding-right:0"><span class="fl">Tokens it passed</span>'+
      '<span class="fw">'+pWin+'/'+passed.length+' won</span>'+
      '<span class="fv" style="color:'+(pAvg>=0?"var(--frog)":"var(--red)")+';width:auto">'+
      (pAvg>=0?"+":"")+(pAvg*100).toFixed(0)+'% avg</span></div>'+
    '<div class="fac" style="padding-left:0;padding-right:0;border-bottom:none"><span class="fl">Tokens it rejected</span>'+
      '<span class="fw">'+bWin+'/'+blocked.length+' won</span>'+
      '<span class="fv" style="color:'+(bAvg>=0?"var(--frog)":"var(--red)")+';width:auto">'+
      (bAvg>=0?"+":"")+(bAvg*100).toFixed(0)+'% avg</span></div>'+
    '<div style="margin-top:12px;font-size:14.5px;line-height:1.7;color:var(--text2)">'+
    (filterHelping
      ? '<b style="color:var(--frog)">The filter is earning its keep.</b> Tokens it rejected did worse '+
        'than the ones it passed, which is exactly what you want from it.'
      : '<b style="color:var(--amber)">The filter may be too strict.</b> On this sample the rejects did '+
        'as well or better. Worth loosening Strict mode or the liquidity-lock requirement \u2014 though '+
        'with '+blocked.length+' tested this could easily be chance.')+
    '<br><br><span style="color:var(--dim);font-size:13px">Note that rejects which were genuine honeypots '+
    'cannot be measured properly here: the simulation lets you sell, whereas in reality you could not. '+
    'So this comparison flatters the rejects.</span></div></div></div>';
}

function learnPanelHTML(){
  var b=learnBuckets();
  if(!b) return '<div class="banner info"><b>Nothing to learn from yet.</b><br><br>'+
    'Once trades resolve, this tracks what your winners had in common \u2014 grade, chain, size, '+
    'age, heat \u2014 and reports which of those actually made money for you.</div>';

  var f=learnFindings();

    b.total+' resolved trade'+(b.total===1?"":"s")+'. ';

    h+='Conclusions need at least '+LEARN_MIN_TOTAL+'. Below that, a couple of lucky trades look '+
      'exactly like a working strategy \u2014 the data is shown below, but do not act on it yet.';
  } else {
    h+='Enough to start reading patterns, though '+b.total+' is still a small sample. '+
      'Treat these as leads to test, not rules.';
  }
  h+='</div>';

  if(f.ready&&f.findings.length){
    f.findings.forEach(function(x){
      var col=x.tone==="bad"?"var(--red)":"var(--frog)";
      h+='<div style="margin:0 18px 10px;padding:14px;border-radius:11px;border:1.5px solid '+col+
        ';background:rgba(255,255,255,.02);font-size:14.5px;line-height:1.65;color:var(--text2)">'+
        x.text+'</div>';
    });
  } else if(f.ready){
    h+='<div class="banner warn">No group stands out yet. Your results are spread fairly evenly, '+
      'which usually means either the sample is still small or the filters are not the deciding factor.</div>';
  }

  // the raw tables, always shown
  [b.byGrade,b.byProfile,b.byHeat,b.byFdv,b.byAge,b.byChain,b.byVerdict].forEach(function(gr){
    if(!gr.rows.length)return;
    h+='<div class="factors" style="margin:0 18px 12px"><div class="hd"><span>'+esc(gr.label)+
      '</span><span>expectancy</span></div>';
    gr.rows.forEach(function(r){
      var col=r.exp>=0?"var(--frog)":"var(--red)";
      var weak=r.n<LEARN_MIN_BUCKET;
      h+='<div class="fac"><span class="fl">'+esc(r.k)+
        (weak?' <span style="color:var(--dim);font-size:12px">(only '+r.n+')</span>':'')+'</span>'+
        '<span class="fw">'+r.w+'/'+r.n+'</span>'+
        '<span class="fv" style="color:'+(weak?"var(--dim)":col)+';width:auto">'+
        (r.exp>=0?"+":"")+usd(r.exp)+'</span></div>';
    });
    h+='</div>';
  });

  h+='<div class="banner warn"><b>Why this is cautious.</b> With a few dozen trades, the difference '+
    'between a real edge and a run of luck is genuinely hard to tell apart \u2014 and tightening filters '+
    'to match past winners is the classic way to make a strategy look better historically and perform '+
    'worse going forward. Groups with fewer than '+LEARN_MIN_BUCKET+' trades are greyed out for that reason.</div>';
  return h;
}

// ===========================================================================
// SIMULATED WALLET + CHARTS
//
// Treats every logged trade as if it came out of one pot, so you can see the
// balance move rather than reading a list of percentages. Charts are hand-drawn
// SVG — no libraries, works offline, and scales to whatever data exists.
// ===========================================================================
function walletHistory(mode){
  var closed=S.trades.filter(function(t){
    if(t.status!=="closed"||!isFinite(t.pnl))return false;
    if(mode==="paper")return t.paper===true;
    if(mode==="real")return t.paper!==true;
    return true;
  }).slice().sort(function(a,b){return (a.exitAt||a.opened)-(b.exitAt||b.opened);});

  var bal=S.cfg.startBalance, peak=bal, maxDD=0;
  var pts=[{i:0,bal:bal,pnl:0,sym:"start",at:closed.length?closed[0].opened:Date.now(),win:null}];
  var wins=0;
  closed.forEach(function(t,i){
    bal+=t.pnl;
    if(t.pnl>0)wins++;
    if(bal>peak)peak=bal;
    var dd=peak>0?((peak-bal)/peak)*100:0;
    if(dd>maxDD)maxDD=dd;
    pts.push({i:i+1,bal:bal,pnl:t.pnl,sym:t.sym,at:t.exitAt||t.opened,
      win:t.pnl>0,rate:(wins/(i+1))*100});
  });

  // money currently tied up in open positions, valued live
  var openVal=0,openCost=0;
  S.trades.forEach(function(t){
    if(t.status!=="open")return;
    if(mode==="paper"&&!t.paper)return;
    if(mode==="real"&&t.paper)return;
    openCost+=t.size*(t.remaining!=null?t.remaining:1);
    var lp=t.live||t.entry;
    openVal+=t.size*(t.remaining!=null?t.remaining:1)*(lp/t.entry);
  });

  return {pts:pts,closed:closed.length,final:bal,peak:peak,maxDD:maxDD,
    openCost:openCost,openVal:openVal,
    totalIfSoldNow:bal+openVal-openCost};
}

// Line chart. Zero-dependency SVG so it renders anywhere.
function lineChartHTML(pts,opts){
  opts=opts||{};
  var W=1000,H=opts.height||220,pad={l:8,r:8,t:14,b:18};
  if(pts.length<2)return '<div class="empty" style="padding:26px">Not enough resolved trades to chart yet.</div>';
  var vals=pts.map(function(p){return p.v;});
  var min=Math.min.apply(null,vals), max=Math.max.apply(null,vals);
  if(min===max){min-=1;max+=1;}
  var range=max-min, padR=range*0.12;
  min-=padR; max+=padR; range=max-min;
  var x=function(i){return pad.l+(i/(pts.length-1))*(W-pad.l-pad.r);};
  var y=function(v){return pad.t+(1-(v-min)/range)*(H-pad.t-pad.b);};

  var line=pts.map(function(p,i){return (i?"L":"M")+x(i).toFixed(1)+","+y(p.v).toFixed(1);}).join(" ");
  var area=line+" L"+x(pts.length-1).toFixed(1)+","+(H-pad.b)+" L"+x(0).toFixed(1)+","+(H-pad.b)+" Z";
  var up=pts[pts.length-1].v>=pts[0].v;
  var col=opts.color||(up?"var(--frog)":"var(--red)");
  var fill=up?"rgba(110,232,90,.14)":"rgba(255,107,122,.14)";

  var h='<svg viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="none" style="width:100%;height:'+H+'px;display:block">';
  // baseline (starting value or zero line)
  if(opts.baseline!=null&&opts.baseline>=min&&opts.baseline<=max){
    h+='<line x1="'+pad.l+'" y1="'+y(opts.baseline).toFixed(1)+'" x2="'+(W-pad.r)+
       '" y2="'+y(opts.baseline).toFixed(1)+'" stroke="var(--line2)" stroke-width="1.5" stroke-dasharray="6 6"/>';
  }
  h+='<path d="'+area+'" fill="'+fill+'"/>';
  h+='<path d="'+line+'" fill="none" stroke="'+col+'" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>';
  // mark each resolved trade
  pts.forEach(function(p,i){
    if(i===0)return;
    var c=p.win===false?"var(--red)":p.win===true?"var(--frog)":col;
    h+='<circle cx="'+x(i).toFixed(1)+'" cy="'+y(p.v).toFixed(1)+'" r="3.5" fill="'+c+'"/>';
  });
  h+='</svg>';
  return h;
}

    '</div>';

      'Including open positions at their live value, the wallet would be <b style="color:'+liveCol+'">'+
      usd(w.totalIfSoldNow)+'</b> if you sold everything now.</div>';
  }
  h+='<div style="margin-top:10px;font-size:13px;color:var(--dim);line-height:1.6">'+
    'Worst drop is peak-to-trough \u2014 the deepest the balance fell from a high. It is the number '+
    'that tells you whether you could actually have sat through this.</div>';
  h+='</div></div>';

  // win rate over time
  var wr=w.pts.filter(function(p){return p.rate!=null;}).map(function(p){return {v:p.rate,win:p.win};});
  if(wr.length>=2){
    var last=wr[wr.length-1].v;

      '<div style="padding:13px 14px;background:var(--raised);display:flex;justify-content:space-between">'+
      '<span style="font-size:12px;text-transform:uppercase;letter-spacing:.09em;color:var(--text2);'+
      'font-weight:800">Success rate</span>'+

      (last>=50?"var(--frog)":"var(--amber)")+'">'+last.toFixed(0)+'%</span></div>'+
      lineChartHTML(wr,{height:150,color:"var(--blue)",baseline:50})+

      'Running win rate after each trade. The dashed line is 50%. A low rate is not necessarily bad \u2014 '+
      'one 10x pays for many stops, which is why the wallet above matters more than this.</div></div>';
  }
  return h;
}

// ===========================================================================
// POST-MORTEM
//
// After a trade resolves, explain what happened in plain language and tie it
// to something the beginner can use. Learning from your own trades beats
// reading general advice, because the example is one you actually lived.
// ===========================================================================
function postMortem(t){
  if(t.status!=="closed"||!t.fp)return null;
  var f=t.fp;
  var won=t.pnl>0;
  var hitTargets=(t.events||[]).filter(function(e){return e.kind==="tp";});
  var stopped=(t.events||[]).some(function(e){return e.kind==="stop";});
  var mult=t.entry>0&&t.exit?t.exit/t.entry:null;

  var story,lesson,tone;

  if(hitTargets.length&&stopped){
    tone="mixed";
    story="It reached "+hitTargets[0].mult+"x, you took half off, then it fell back and the rest exited at your stop.";
    lesson="This is the case that shows why selling in steps matters. Without that first sale at "+
      hitTargets[0].mult+"x this trade would have been a straight loss; with it you finished "+
      (won?"up "+usd(t.pnl):"down only "+usd(Math.abs(t.pnl)))+". Taking something off the table early "+
      "is what turns some losers into break-evens.";
  } else if(hitTargets.length>=3){
    tone="win";
    story="It ran the whole ladder \u2014 "+hitTargets.map(function(e){return e.mult+"x";}).join(", ")+
      " \u2014 and closed out at the top rung.";
    lesson="One trade like this pays for a lot of stopped-out ones. That is the whole economics of "+
      "microcaps: you are not trying to be right often, you are trying to be positioned when a rare "+
      "one runs. Which is also why the position size has to be small enough that you can afford to "+
      "keep taking the losses in between.";
  } else if(hitTargets.length){
    tone="win";
    story="It hit "+hitTargets.map(function(e){return e.mult+"x";}).join(" then ")+" and closed there.";
    lesson="A clean win. Worth noticing what it looked like at entry \u2014 "+esc(f.fdvBand)+" size, "+
      esc(f.ageBand)+" old, grade "+esc(f.grade)+" \u2014 and whether your other winners share that shape.";
  } else if(stopped){
    tone="loss";
    story="It never reached your first target and exited at the stop, down "+t.stopPct+"% from entry.";
    var bits=[];
    if(f.accel!=null&&f.accel<45)bits.push("activity was not really building when you entered (acceleration "+f.accel+"/100)");
    if(f.flow!=null&&f.flow<45)bits.push("sellers were already leading (flow "+f.flow+"/100)");
    if(f.room!=null&&f.room<45)bits.push("it was already fairly large, so there was less room to run (headroom "+f.room+"/100)");
    if(f.profile!=null&&f.profile<=2)bits.push("it only matched "+f.profile+" of 6 parabolic traits");
    lesson=bits.length
      ? "Looking back at the entry: "+bits.join("; ")+". Worth checking whether your losers keep sharing those numbers \u2014 that is what the What's Working tab is for."
      : "Nothing about the entry looks obviously wrong; the metrics were reasonable and it still went down. "+
        "That happens constantly and is not a mistake. Most tokens fail regardless of how they look. "+
        "A loss with a sound setup is the cost of doing this, not evidence you chose badly.";
  } else {
    tone="mixed";
    story="It closed without hitting either your stop or a target.";
    lesson="Partial or manual exits are harder to learn from, because you cannot tell what the plan "+
      "would have produced. Letting them run to a stop or target keeps the data clean.";
  }

  return {tone:tone,story:story,lesson:lesson,won:won,mult:mult};
}

function postMortemHTML(t){
  var pm=postMortem(t); if(!pm)return "";
  var col=pm.tone==="win"?"var(--frog)":pm.tone==="loss"?"var(--red)":"var(--amber)";
  var icon=pm.tone==="win"?"\u2705":pm.tone==="loss"?"\u274c":"\u2696\ufe0f";
  return '<div style="margin-top:12px;border:1px solid '+col+';border-radius:11px;overflow:hidden">'+
    '<div style="padding:11px 14px;background:rgba(255,255,255,.03);font-size:12px;text-transform:uppercase;'+
    'letter-spacing:.09em;font-weight:800;color:'+col+'">'+icon+' What this trade taught</div>'+
    '<div style="padding:14px;font-size:14.5px;line-height:1.7;color:var(--text2)">'+
    '<b style="color:var(--text)">'+esc(pm.story)+'</b><br><br>'+pm.lesson+'</div></div>';
}

// ===========================================================================
// PERSONALISED FIT  —  ranking learned from your own resolved trades
//
// For each attribute (grade, chain, size band, age band, profile match, heat)
// this measures how your trades in that bucket actually performed, then nudges
// a candidate's rank up or down accordingly.
//
// The statistics matter here. Raw bucket averages are wildly unreliable at
// small n — three lucky trades on one chain would otherwise dominate ranking
// forever. So every bucket is shrunk toward zero by n/(n+K): with 2 trades a
// bucket carries almost no weight, with 20 it carries most of its measured
// value. The total adjustment is also capped, so this can nudge the order but
// never override the underlying analysis, and it NEVER touches the safety gate.
// ===========================================================================
var FIT_K=6;              // shrinkage constant
var FIT_MAX=14;           // most points fit can add or remove
var FIT_MIN_TRADES=12;    // below this, personalisation stays off

// ===========================================================================
// ADAPTIVE FACTOR WEIGHTS
//
// The eight factors that make up a grade ship with weights I chose. Those are
// a prior, not truth. This measures how each factor's score at ENTRY actually
// correlated with the return you got, and shifts the weights toward whatever
// has been predictive for you.
//
// Two safeguards, because this is where a learning system can most easily
// fool itself:
//   1. The blend toward learned weights scales with sample size and never
//      exceeds 60% — my priors always retain a say, so one odd stretch of
//      trades cannot rewrite the grader.
//   2. Correlations are computed on entry-time values only, and the whole
//      thing is inert below WEIGHT_MIN_N trades.
// ===========================================================================
var WEIGHT_MIN_N=25;
var WEIGHT_MAX_BLEND=0.60;

// Market conditions change. A trade from three months ago should not carry
// the same weight as one from last week, so everything the models learn is
// discounted with a half-life: at 45 days old a trade counts half as much,
// at 90 days a quarter. Old data still contributes — it just stops dominating.
var RECENCY_HALFLIFE_DAYS=45;
function recencyWeight(t){
  var when=t.exitAt||t.opened||Date.now();
  var days=(Date.now()-when)/86400000;
  if(!(days>0))return 1;
  return Math.pow(0.5,days/RECENCY_HALFLIFE_DAYS);
}

function adaptiveWeights(){
  var closed=S.trades.filter(function(t){
    return t.status==="closed"&&t.fp&&isFinite(t.pnl)&&t.size>0&&!t.blockedTest;
  });
  var base={};
  FACTORS.forEach(function(f){base[f.k]=f.w;});
  if(closed.length<WEIGHT_MIN_N)
    return {ready:false,n:closed.length,weights:base,base:base,blend:0,corr:null};

  var rows=closed.map(function(t){
    return {r:t.pnl/t.size, f:t.fp, w:recencyWeight(t)};
  });
  var keys=["accel","turn","room","flow","liq","dist"];
  var fpMap={accel:"accel",turn:"turn",room:"room",flow:"flow",liq:"liqF",dist:"dist"};

  var wSum=rows.reduce(function(a,x){return a+x.w;},0)||1;
  var meanR=rows.reduce(function(a,x){return a+x.r*x.w;},0)/wSum;
  var corr={};
  keys.forEach(function(k){
    var fk=fpMap[k];
    var vals=rows.map(function(x){return num(x.f[fk]);});
    var meanV=rows.reduce(function(a,x,i){return a+vals[i]*x.w;},0)/wSum;
    var num1=0,dv=0,dr=0;
    rows.forEach(function(x,i){
      var a=vals[i]-meanV, b=x.r-meanR;
      num1+=a*b*x.w; dv+=a*a*x.w; dr+=b*b*x.w;
    });
    var c=(dv>0&&dr>0)?num1/Math.sqrt(dv*dr):0;
    corr[k]=isFinite(c)?c:0;
  });

  // Turn correlations into positive weights. A factor that correlated
  // negatively gets pushed down, never below a floor — no factor is deleted
  // outright on the strength of a few dozen trades.
  var learned={},sum=0;
  FACTORS.forEach(function(f){
    var c=corr[f.k];
    var w=(c==null)?f.w:f.w*(1+Math.max(-0.8,Math.min(1.2,c*1.6)));
    w=Math.max(f.w*0.25,w);
    learned[f.k]=w; sum+=w;
  });
  Object.keys(learned).forEach(function(k){learned[k]=learned[k]/sum;});

  // blend grows with n, capped
  var blend=Math.min(WEIGHT_MAX_BLEND,(closed.length-WEIGHT_MIN_N)/60+0.2);
  var out={},osum=0;
  FACTORS.forEach(function(f){
    var w=base[f.k]*(1-blend)+learned[f.k]*blend;
    out[f.k]=w; osum+=w;
  });
  Object.keys(out).forEach(function(k){out[k]=out[k]/osum;});

  return {ready:true,n:closed.length,weights:out,base:base,learned:learned,blend:blend,corr:corr};
}

// Cached per render so conviction() doesn't recompute it for every token.
var AW_CACHE={at:0,val:null};
function currentWeights(){
  if(!S.cfg.adaptWeights)return null;
  if(Date.now()-AW_CACHE.at<4000&&AW_CACHE.val)return AW_CACHE.val;
  AW_CACHE={at:Date.now(),val:adaptiveWeights()};
  return AW_CACHE.val;
}
function invalidateWeights(){AW_CACHE={at:0,val:null};}

function weightsPanelHTML(){
  var aw=adaptiveWeights();
  if(!aw.ready)
    return '<div class="banner warn"><b>\u2699\ufe0f Adaptive grading waiting for data</b><br><br>'+
      aw.n+' of '+WEIGHT_MIN_N+' resolved trades. Once there are enough, the eight factors behind '+
      'every grade start reweighting toward whichever ones actually predicted your results.</div>';

  var rows=FACTORS.slice().map(function(f){
    return {k:f.k,n:f.n,base:aw.base[f.k],now:aw.weights[f.k],c:aw.corr[f.k]||0};
  }).sort(function(a,b){return b.now-a.now;});

  var h='<div class="banner info" style="border-color:var(--frog)"><b>\u2699\ufe0f Adaptive grading is on</b><br><br>'+
    'Grades are now weighted using '+aw.n+' of your resolved trades \u2014 '+
    (aw.blend*100).toFixed(0)+'% learned, '+((1-aw.blend)*100).toFixed(0)+'% original. '+
    'Factors that predicted your winners count for more.</div>';

  h+='<div class="factors" style="margin:0 18px 12px"><div class="hd"><span>Factor weights</span>'+
    '<span>was \u2192 now</span></div>';
  rows.forEach(function(r){
    var up=r.now>r.base+0.005, down=r.now<r.base-0.005;

    h+='<div class="fac"><span class="fl">'+esc(r.n)+'</span>'+
      '<span class="fw" style="color:var(--dim)">r='+r.c.toFixed(2)+'</span>'+
      '<span class="fv" style="color:'+col+';width:auto">'+(r.base*100).toFixed(0)+'% \u2192 '+
      (r.now*100).toFixed(0)+'%</span></div>';
  });
  h+='</div>';

  h+='<div class="banner warn"><b>How to read this.</b> <span style="font-family:var(--mono)">r</span> is '+
    'the correlation between that factor\u2019s score at entry and what the trade returned, from '+
    '\u22121 to +1. Values near zero mean the factor told you nothing. Even a strong-looking value '+
    'can be coincidence at this sample size, which is why the blend is capped at '+
    (WEIGHT_MAX_BLEND*100).toFixed(0)+'% \u2014 the original weights always keep a say, so one unusual '+
    'stretch cannot rewrite the grader.</div>';
  return h;
}

// ===========================================================================
// EXIT LADDER BACKTEST
//
// Every resolved paper trade records the highest multiple it reached before
// finishing. That is enough to replay the same trades under a different exit
// plan and see what each would have produced. It answers "should I take 5x or
// hold for 10x" with your own results instead of a guess.
//
// The honest limit: peak is the best price reached between price checks, so
// a spike between updates may be missed, and every ladder is credited with
// filling exactly at its rungs. It compares plans fairly against each other;
// it does not promise those exact numbers.
// ===========================================================================
var LADDERS=[
  {name:"2x / 3x / 5x",     tp:[2,3,5],    note:"very conservative"},
  {name:"2x / 4x / 6x",     tp:[2,4,6],    note:"conservative"},
  {name:"2x / 4x / 10x",    tp:[2,4,10],   note:"balanced (default)"},
  {name:"3x / 6x / 15x",    tp:[3,6,15],   note:"patient"},
  {name:"2x / 5x / 25x",    tp:[2,5,25],   note:"lottery tail"},
  {name:"all at 2x",        tp:[2],        note:"take the double, done"},
  {name:"all at 3x",        tp:[3],        note:"single exit"}
];

// Replay one trade under a given ladder using its recorded peak.
function replayLadder(t,tp){
  if(!t.entry||!isFinite(t.peak)||t.peak<=0)return null;
  var peak=t.peak;
  var stopMult=1-(t.stopPct/100);
  var steps=tp.slice().sort(function(a,b){return a-b;});
  var remaining=1, proceeds=0;

  steps.forEach(function(m,idx){
    if(peak<m)return;
    var isLast=idx===steps.length-1;
    var frac=isLast?remaining:(idx===0?remaining*0.5:remaining*0.25);
    if(frac<=0)return;
    proceeds+=t.size*frac*m;
    remaining-=frac;
  });

  // Whatever is left is assumed to come back down to the stop. This is the
  // pessimistic assumption and it is deliberate: a plan should not be
  // credited for a runner that merely might have kept going.
  if(remaining>0.001) proceeds+=t.size*remaining*stopMult;

  return proceeds-t.size-(t.costs||0);
}

function ladderBacktest(){
  var closed=S.trades.filter(function(t){
    return t.status==="closed"&&isFinite(t.peak)&&t.peak>0&&t.size>0;
  });
  if(closed.length<8)return {ready:false,n:closed.length};

  var results=LADDERS.map(function(L){
    var total=0,wins=0,n=0;
    closed.forEach(function(t){
      var p=replayLadder(t,L.tp);
      if(p==null)return;
      total+=p; n++; if(p>0)wins++;
    });
    return {name:L.name,note:L.note,tp:L.tp,total:total,n:n,
      exp:n?total/n:0, winRate:n?(wins/n)*100:0};
  }).filter(function(r){return r.n>0;});

  results.sort(function(a,b){return b.total-a.total;});
  var curKey=S.cfg.tp.slice().sort(function(a,b){return a-b;}).join(",");
  var current=results.filter(function(r){
    return r.tp.slice().sort(function(a,b){return a-b;}).join(",")===curKey;
  })[0]||null;

  // how often each level was actually reached
  var reach={};
  [1.5,2,3,4,5,6,10,15,25].forEach(function(m){
    reach[m]=closed.filter(function(t){return t.peak>=m;}).length;
  });

  return {ready:true,n:closed.length,results:results,current:current,reach:reach,total:closed.length};
}

  h+='</div>';

  } else if(cur){

  }

  h+='<div class="toolbar"><button class="primary" id="applyLadder" data-tp="'+esc(best.tp.join(","))+'">'+
    'Use '+esc(best.name)+'</button></div>';

function fitModel(){
  var closed=S.trades.filter(function(t){return t.status==="closed"&&t.fp&&isFinite(t.pnl);});
  if(closed.length<FIT_MIN_TRADES)return {ready:false,n:closed.length};

  // Normalise P&L to "per dollar staked" so trades of different sizes compare.
  var norm=closed.map(function(t){
    return {fp:t.fp, r:(t.size>0?t.pnl/t.size:0), w:recencyWeight(t)};
  });
  var wAll=norm.reduce(function(a,x){return a+x.w;},0)||1;
  var overall=norm.reduce(function(a,x){return a+x.r*x.w;},0)/wAll;

  function bucketStats(keyFn){
    var m={};
    norm.forEach(function(x){
      var k=keyFn(x.fp); if(k==null||k==="?")return;
      m[k]=m[k]||{n:0,sum:0,w:0};
      m[k].n++; m[k].sum+=x.r*x.w; m[k].w+=x.w;
    });
    var out={};
    Object.keys(m).forEach(function(k){
      var mean=m[k].w>0?m[k].sum/m[k].w:0;
      // difference from your own average, shrunk by sample size
      var edge=(mean-overall)*(m[k].n/(m[k].n+FIT_K));
      out[k]={n:m[k].n,mean:mean,edge:edge};
    });
    return out;
  }

  return {
    ready:true, n:closed.length, overall:overall,
    grade:bucketStats(function(f){return f.grade;}),
    chain:bucketStats(function(f){return f.chain;}),
    fdv:bucketStats(function(f){return f.fdvBand;}),
    age:bucketStats(function(f){return f.ageBand;}),
    profile:bucketStats(function(f){return f.profile==null?null:(f.profile>=5?"hi":f.profile>=3?"mid":"lo");}),
    heat:bucketStats(function(f){return f.heat==null?null:(f.heat>=60?"hi":f.heat>=35?"mid":"lo");})
  };
}

// Score a candidate against that model. Returns points and the reasons why.
function fitScore(p,model){
  if(!model||!model.ready||!p._cv)return null;
  var fdv=num(p.fdv||p.marketCap), age=ageH(p.pairCreatedAt);
  var band=fdv<100000?"<100K":fdv<500000?"100K-500K":fdv<2000000?"500K-2M":fdv<10000000?"2M-10M":">10M";
  var ageBand=age==null?"?":age<6?"<6h":age<24?"6-24h":age<72?"1-3d":age<336?"3-14d":">14d";
  var pm=profileMatch(p);
  var profBand=pm?(pm.n>=5?"hi":pm.n>=3?"mid":"lo"):null;
  var hs=p._heat?p._heat.score:null;
  var heatBand=hs==null?null:(hs>=60?"hi":hs>=35?"mid":"lo");

  var parts=[];
  function add(map,key,label){
    if(!map||key==null)return;
    var b=map[key]; if(!b||b.n<2)return;
    parts.push({label:label,key:key,n:b.n,edge:b.edge});
  }
  add(model.grade,p._cv.grade,"grade "+p._cv.grade);
  add(model.chain,p.chainId,chainName(p.chainId));
  add(model.fdv,band,band+" size");
  add(model.age,ageBand,ageBand+" old");
  add(model.profile,profBand,profBand==="hi"?"strong profile match":profBand==="mid"?"partial profile match":"weak profile match");
  add(model.heat,heatBand,heatBand==="hi"?"high heat":heatBand==="mid"?"moderate heat":"low heat");

  if(!parts.length)return null;
  // average the edges, then convert to points and cap
  var avgEdge=parts.reduce(function(a,x){return a+x.edge;},0)/parts.length;
  var pts=Math.max(-FIT_MAX,Math.min(FIT_MAX,avgEdge*22));
  parts.sort(function(a,b){return Math.abs(b.edge)-Math.abs(a.edge);});
  return {pts:pts,parts:parts,n:model.n};
}

function fitHTML(p){
  if(!S.cfg.personalise||!p._fit)return "";

  if(Math.abs(f.pts)<1)return "";
  var up=f.pts>0, col=up?"var(--frog)":"var(--red)";

// ===========================================================================
// SHADOW TRACKING  —  what happened to the ones you did NOT take
//
// The learning model has a blind spot: it only sees trades you logged, which
// is a sample you selected. It can tell you what your winners had in common,
// but not whether your picking beats simply taking everything the scanner
// surfaced. So every candidate shown is quietly recorded and its peak tracked.
// Later this answers the only question that really matters about selection:
// did choosing help, or would taking them all have done just as well?
// ===========================================================================
var SHADOW_KEY="rp:shadow";
var SHADOW_MAX=400;
var SHADOW_TTL=14*24*3600*1000;

function shadowLoad(){
  if(!LS_OK)return {};
  try{var r=localStorage.getItem(SHADOW_KEY);var o=r?JSON.parse(r):{};return (o&&typeof o==="object")?o:{};}
  catch(e){return {};}
}
function shadowSave(o){
  if(!LS_OK)return;
  try{localStorage.setItem(SHADOW_KEY,JSON.stringify(o));}
  catch(e){ try{localStorage.removeItem(SHADOW_KEY);}catch(e2){} }
}

// Record a candidate the scanner showed. First sighting only — the entry
// snapshot must not be overwritten later or the peak becomes meaningless.
function shadowRecord(list){
  if(!LS_OK||!list||!list.length)return;
  var o=shadowLoad(), now=Date.now(), added=0;
  list.forEach(function(p){
    if(!p||!p._cv||!p.baseToken)return;
    var k=(p.chainId||"")+":"+String(p.baseToken.address||"").toLowerCase();
    if(o[k])return;
    var price=num(p.priceUsd); if(price<=0)return;
    o[k]={
      t:now, sym:p.baseToken.symbol||"?", chain:p.chainId,
      p0:price, peak:price, last:price, seen:1,
      grade:p._cv.grade, score:p._cv.total,
      heat:(p._heat&&p._heat.score)||null,
      fdv:num(p.fdv||p.marketCap),
      ageH:ageH(p.pairCreatedAt)
    };
    added++;
  });
  // prune old and cap size
  var keys=Object.keys(o);
  keys.forEach(function(k){ if(now-o[k].t>SHADOW_TTL)delete o[k]; });
  keys=Object.keys(o);
  if(keys.length>SHADOW_MAX){
    keys.sort(function(a,b){return o[a].t-o[b].t;});
    keys.slice(0,keys.length-SHADOW_MAX).forEach(function(k){delete o[k];});
  }
  if(added)shadowSave(o);
}

// Update peaks from whatever prices the live feed already fetched. No extra
// network calls — this piggybacks on data that is arriving anyway.
function shadowUpdate(){
  if(!LS_OK)return;
  var o=shadowLoad(), changed=false;
  Object.keys(LIVE.prices).forEach(function(k){
    var e=o[k]; if(!e)return;
    var px=LIVE.prices[k].px; if(!(px>0))return;
    e.last=px; e.seen=(e.seen||0)+1;
    if(px>e.peak){e.peak=px;changed=true;}
    else changed=true;
  });
  if(changed)shadowSave(o);
}

// Compare what you took against what you passed on.
function shadowStats(){
  if(!LS_OK)return null;
  var o=shadowLoad();
  var keys=Object.keys(o);
  if(!keys.length)return null;

  var taken={}, n=0;
  S.trades.forEach(function(t){
    if(!t.addr)return;
    taken[(t.chain||"")+":"+String(t.addr).toLowerCase()]=1; n++;
  });

  function summarise(arr){
    if(!arr.length)return null;
    var hit2=0,hit4=0,down50=0,sumPeak=0;
    arr.forEach(function(e){
      var m=e.p0>0?e.peak/e.p0:1;
      var d=e.p0>0?e.last/e.p0:1;
      if(m>=2)hit2++;
      if(m>=4)hit4++;
      if(d<=0.5)down50++;
      sumPeak+=m;
    });
    return {n:arr.length,hit2:hit2,hit4:hit4,down50:down50,
      pct2:(hit2/arr.length)*100,pct4:(hit4/arr.length)*100,
      pctDown:(down50/arr.length)*100,avgPeak:sumPeak/arr.length};
  }

  var all=keys.map(function(k){return o[k];});
  var tookArr=keys.filter(function(k){return taken[k];}).map(function(k){return o[k];});
  var skipArr=keys.filter(function(k){return !taken[k];}).map(function(k){return o[k];});

  // mature enough to judge: seen more than once and at least an hour old
  var mature=function(e){return (Date.now()-e.t)>3600000&&e.seen>1;};
  return {
    tracked:all.length,
    matureCount:all.filter(mature).length,
    all:summarise(all.filter(mature)),
    took:summarise(tookArr.filter(mature)),
    skipped:summarise(skipArr.filter(mature)),
    best:all.filter(mature).map(function(e){
      return {sym:e.sym,chain:e.chain,grade:e.grade,mult:e.p0>0?e.peak/e.p0:1,taken:!!taken[(e.chain||"")+":"+""]};
    }).sort(function(a,b){return b.mult-a.mult;}).slice(0,5)
  };
}

// ===========================================================================
// SNAPSHOT TRACKING  —  the missing dimension
//
// Every check up to here has been a snapshot: what does this token look like
// right now. But the things that precede a nuke are CHANGES — liquidity being
// withdrawn, volume dying while price holds up, the deployer's stake growing.
// None of that is visible in a single observation.
//
// So every token seen is recorded locally. On any later sighting the deltas
// are computed, and a falling liquidity line is treated as what it usually is:
// a rug in progress.
// ===========================================================================
function snapKey(chain,addr){return "rp:s:"+chain+":"+String(addr).toLowerCase();}

function snapRecord(p,sec){
  if(!LS_OK)return;
  var addr=(p.baseToken&&p.baseToken.address)||""; if(!addr)return;
  try{
    var k=snapKey(p.chainId,addr);
    var prev=[];
    var raw=localStorage.getItem(k);
    if(raw){var pr=JSON.parse(raw);if(Array.isArray(pr))prev=pr;}
    prev.push({
      t:Date.now(),
      liq:num(p.liquidity&&p.liquidity.usd),
      px:num(p.priceUsd),
      fdv:num(p.fdv||p.marketCap),
      v24:num(p.volume&&p.volume.h24),
      dev:(sec&&sec.creatorPct!=null)?sec.creatorPct:null,
      t10:(sec&&typeof sec.top10==="number")?sec.top10:null
    });
    // keep a short history; drop anything older than a week
    var cutoff=Date.now()-7*24*3600*1000;
    prev=prev.filter(function(x){return x.t>cutoff;}).slice(-12);
    localStorage.setItem(k,JSON.stringify(prev));
  }catch(e){
    // storage full — clear old snapshots and carry on
    try{Object.keys(localStorage).forEach(function(kk){
      if(kk.indexOf("rp:s:")===0)localStorage.removeItem(kk);});}catch(e2){}
  }
}

function snapHistory(p){
  if(!LS_OK)return null;
  var addr=(p.baseToken&&p.baseToken.address)||""; if(!addr)return null;
  try{
    var raw=localStorage.getItem(snapKey(p.chainId,addr));
    if(!raw)return null;
    var arr=JSON.parse(raw);
    if(!Array.isArray(arr)||arr.length<1)return null;
    return arr;
  }catch(e){return null;}
}

// Compare now against the earliest useful past observation.
function snapDelta(p,sec){
  var hist=snapHistory(p);
  if(!hist||!hist.length)return null;
  var first=hist[0];
  var ageMin=(Date.now()-first.t)/60000;
  if(ageMin<3)return null;                       // too recent to mean anything

  var liqNow=num(p.liquidity&&p.liquidity.usd);
  var pxNow=num(p.priceUsd);
  var v24Now=num(p.volume&&p.volume.h24);
  var devNow=(sec&&sec.creatorPct!=null)?sec.creatorPct:null;

  var d={
    minutes:ageMin, samples:hist.length,
    liqPct: first.liq>0 ? ((liqNow-first.liq)/first.liq)*100 : null,
    pxPct:  first.px>0  ? ((pxNow-first.px)/first.px)*100   : null,
    volPct: first.v24>0 ? ((v24Now-first.v24)/first.v24)*100 : null,
    devDelta: (devNow!=null&&first.dev!=null) ? devNow-first.dev : null
  };
  return d;
}

// Turn those deltas into explicit dump-risk flags.
function dumpRisk(p,sec){
  var d=snapDelta(p,sec);
  var flags=[], severe=0;

  // 1. Liquidity leaving is the clearest rug-in-progress signal there is.
  if(d&&d.liqPct!=null){
    if(d.liqPct<=-30){flags.push({s:"bad",t:"Liquidity down "+Math.abs(d.liqPct).toFixed(0)+"% since first seen — liquidity is being withdrawn"});severe++;}
    else if(d.liqPct<=-12)flags.push({s:"wr",t:"Liquidity down "+Math.abs(d.liqPct).toFixed(0)+"% since first seen"});
    else if(d.liqPct>=15)flags.push({s:"ok",t:"Liquidity up "+d.liqPct.toFixed(0)+"% since first seen"});
  }
  // 2. Deployer accumulating back into their own token before a sell.
  if(d&&d.devDelta!=null&&d.devDelta>=2){
    flags.push({s:"bad",t:"Deployer's stake grew "+d.devDelta.toFixed(1)+" points since first seen"});severe++;
  }
  // 3. Price holding while volume collapses = distribution into thin bids.
  if(d&&d.volPct!=null&&d.pxPct!=null&&d.volPct<=-45&&d.pxPct>-5){
    flags.push({s:"wr",t:"Volume down "+Math.abs(d.volPct).toFixed(0)+"% while price held — interest is fading"});
  }

  // --- snapshot-only downside signals (work on first sighting too) ---
  var h24=num(p.priceChange&&p.priceChange.h24);
  var h6=num(p.priceChange&&p.priceChange.h6);
  var liq=num(p.liquidity&&p.liquidity.usd);
  var fdv=num(p.fdv||p.marketCap);
  var v24=num(p.volume&&p.volume.h24);

  // 4. Already ran hard — you would be buying someone else's exit.
  if(h24>=300){flags.push({s:"bad",t:"Already up "+h24.toFixed(0)+"% in 24h — most of the move is behind it"});severe++;}
  else if(h24>=120)flags.push({s:"wr",t:"Up "+h24.toFixed(0)+"% in 24h — late entry"});

  // 5. Rolling over: strong day, weak last six hours.
  if(h24>50&&h6<-10)flags.push({s:"wr",t:"Turned down "+Math.abs(h6).toFixed(0)+"% in 6h after a strong day"});

  // 6. Market cap far beyond what backs it.
  var ratio=fdv>0?liq/fdv:0;
  if(ratio>0&&ratio<0.03){flags.push({s:"bad",t:"Only "+(ratio*100).toFixed(1)+"% of its valuation is backed by liquidity"});severe++;}

  // 7. Churn far above pool size — usually wash trading or a frenzy top.
  var turn=liq>0?v24/liq:0;
  if(turn>25){flags.push({s:"wr",t:"Volume is "+turn.toFixed(0)+"x liquidity — abnormal churn"});}

  // 8. Concentration that can end it in one transaction.
  if(sec&&typeof sec.top10==="number"&&sec.top10>28)
    flags.push({s:"wr",t:"Top 10 hold "+sec.top10.toFixed(0)+"% — a few wallets can end it"});

  var score=Math.max(0,100-(severe*30)-(flags.filter(function(f){return f.s==="wr";}).length*10));
  return {flags:flags,severe:severe,score:score,delta:d};
}

// ===========================================================================
// HEATING UP  —  the build phase, before the vertical move
//
// The idea: compare the token's own recent trading rate against its slower
// averages. If the last hour is running well above the 6h rate, and the 6h
// above the 24h rate, activity is compounding rather than spiking. Crucially
// this REQUIRES that price has not already run — the point is to catch the
// build, not the top. A token up 400% is disqualified here by design.
// ===========================================================================
function heatScore(p){
  var v1=num(p.volume&&p.volume.h1);
  var v6=num(p.volume&&p.volume.h6);
  var v24=num(p.volume&&p.volume.h24);
  var h1=num(p.priceChange&&p.priceChange.h1);
  var h6=num(p.priceChange&&p.priceChange.h6);
  var h24=num(p.priceChange&&p.priceChange.h24);
  var tx1=(p.txns&&p.txns.h1)||{}, tx24=(p.txns&&p.txns.h24)||{};
  var b1=num(tx1.buys), s1=num(tx1.sells), b24=num(tx24.buys), s24=num(tx24.sells);

  if(v24<=0)return null;

  // hourly rates at each window
  var r1=v1, r6=v6/6, r24=v24/24;
  var accel6 = r6>0 ? r1/r6 : 0;      // last hour vs 6h pace
  var accel24= r24>0 ? r6/r24 : 0;    // 6h pace vs 24h pace

  // Both legs rising = compounding interest, not a single candle.
  var stacked = accel6>1.15 && accel24>1.1;

  // Trade count building too (volume alone can be one whale or a wash trade)
  var tRate24 = (b24+s24)/24;
  var tAccel = tRate24>0 ? (b1+s1)/tRate24 : 0;

  // Buyers must be leading
  var flow1 = (b1+s1)>8 ? b1/(b1+s1) : 0.5;

  // Disqualify anything that already ran — this tab is for the build only
  var alreadyRan = h24>=100 || h6>=60;
  var overheated = accel6>6;           // vertical spike, not a build

  var score=0;
  score += Math.min(30, Math.max(0,(accel6-1)*28));
  score += Math.min(25, Math.max(0,(accel24-1)*30));
  score += Math.min(20, Math.max(0,(tAccel-1)*22));
  score += Math.min(15, Math.max(0,(flow1-0.5)*90));
  // reward a token that's up modestly — moving, but not blown off
  score += (h24>2&&h24<60) ? 10 : (h24>=60&&h24<100 ? 4 : 0);

  if(alreadyRan) score*=0.25;
  if(overheated) score*=0.5;

  return {
    score:Math.round(Math.max(0,Math.min(100,score))),
    accel6:accel6, accel24:accel24, tAccel:tAccel,
    flow1:flow1, stacked:stacked, alreadyRan:alreadyRan, overheated:overheated,
    h24:h24, h6:h6, h1:h1
  };
}

// Snapshot history turns a guess into evidence: is volume genuinely higher
// than when we first saw it, and is liquidity growing rather than leaving?
function heatConfirmation(p){
  var hist=snapHistory(p);
  if(!hist||hist.length<2)return null;
  var first=hist[0], last=hist[hist.length-1];
  var mins=(Date.now()-first.t)/60000;
  if(mins<10)return null;
  return {
    minutes:mins, samples:hist.length,
    volGrowth: first.v24>0 ? ((num(p.volume&&p.volume.h24)-first.v24)/first.v24)*100 : null,
    liqGrowth: first.liq>0 ? ((num(p.liquidity&&p.liquidity.usd)-first.liq)/first.liq)*100 : null,
    pxGrowth:  first.px>0  ? ((num(p.priceUsd)-first.px)/first.px)*100 : null
  };
}

function heatLabel(hs){
  if(!hs)return "";
  if(hs.alreadyRan)return "already moved";
  if(hs.overheated)return "spiking, not building";
  if(hs.score>=70)return "building fast";
  if(hs.score>=50)return "building steadily";
  if(hs.score>=30)return "early stirrings";
  return "quiet";
}

// Social presence, from data DexScreener already returns. This is not
// sentiment analysis — it reports whether the project has public channels
// and gives one-tap search. Automated tweet analysis needs the paid X API
// and a server, neither of which a static site has.

// ===========================================================================
// LIVE PRICE FEED
//
// Every visible token is polled on a timer. Two things make this safe and
// smooth rather than rate-limit suicide:
//   1. Addresses are BATCHED — DexScreener takes up to 30 per request, so a
//      screen full of tokens costs one call per chain, not one per token.
//   2. Updates patch the DOM directly instead of re-rendering. A full render
//      every 5s would destroy scroll position and any half-typed input.
// Polling pauses when the tab is hidden so it doesn't drain the battery.
// ===========================================================================
var LIVE={timer:null, running:false, prices:{}, lastTick:0, inflight:false};

function liveKey(chain,addr){return (chain||"")+":"+String(addr||"").toLowerCase();}

// Everything currently on screen that has a price worth tracking.
function visibleTokens(){
  var out=[],seen={};
  function add(p){
    if(!p||!p.baseToken||!p.baseToken.address)return;
    var k=liveKey(p.chainId,p.baseToken.address);
    if(seen[k])return; seen[k]=1;
    out.push({chain:p.chainId,addr:p.baseToken.address,key:k});
  }
  if(S.tab==="scan"){rankAndFilter(S.passed).forEach(add);rankAndFilter(S.unverified).slice(0,10).forEach(add);}
  else if(S.tab==="heat"){rankAndFilter(S.heat).forEach(add);rankAndFilter(S.heatUnverified).slice(0,10).forEach(add);}
  else if(S.tab==="fresh"){rankAndFilter(S.fresh).forEach(add);rankAndFilter(S.freshUnverified).slice(0,15).forEach(add);}
  else if(S.tab==="watch"){S.watch.forEach(function(a){var d=S.watchData[a];if(d&&!d._err)add(d);});}
  else if(S.tab==="lookup"){if(S.lookup)add(S.lookup);}
  else if(S.tab==="journal"){
    S.trades.filter(function(t){return t.status==="open";}).forEach(function(t){
      var k=liveKey(t.chain,t.addr);
      if(seen[k]||!t.addr)return; seen[k]=1;
      out.push({chain:t.chain,addr:t.addr,key:k});
    });
  }
  return out.slice(0,60);   // hard ceiling so a huge list can't hammer the API
}

function liveTick(){
  if(LIVE.inflight)return;
  var toks=visibleTokens();
  if(!toks.length)return;

  // group by chain, 30 per request
  var byChain={};
  toks.forEach(function(t){(byChain[t.chain]=byChain[t.chain]||[]).push(t.addr);});
  var calls=[];
  Object.keys(byChain).forEach(function(ch){
    var a=byChain[ch];
    for(var i=0;i<a.length;i+=30)
      calls.push(fetchJSON(DS+"/latest/dex/tokens/"+a.slice(i,i+30).join(","),8000)
        .catch(function(){return {pairs:[]};}));
  });
  if(!calls.length)return;

  LIVE.inflight=true;
  Promise.all(calls).then(function(res){
    var best={};
    res.forEach(function(d){
      ((d&&d.pairs)||[]).forEach(function(p){
        var k=liveKey(p.chainId,(p.baseToken&&p.baseToken.address)||"");
        var liq=num(p.liquidity&&p.liquidity.usd);
        if(!best[k]||liq>num(best[k].liquidity&&best[k].liquidity.usd))best[k]=p;
      });
    });
    Object.keys(best).forEach(function(k){
      var p=best[k];
      var prev=LIVE.prices[k];
      var next={
        px:num(p.priceUsd),
        m5:num(p.priceChange&&p.priceChange.m5),
        h1:num(p.priceChange&&p.priceChange.h1),
        h6:num(p.priceChange&&p.priceChange.h6),
        h24:num(p.priceChange&&p.priceChange.h24),
        liq:num(p.liquidity&&p.liquidity.usd),
        v24:num(p.volume&&p.volume.h24),
        at:Date.now(),
        dir: prev&&prev.px ? (num(p.priceUsd)>prev.px?1:(num(p.priceUsd)<prev.px?-1:0)) : 0
      };
      LIVE.prices[k]=next;
      // keep the underlying objects fresh so scoring/alerts use live numbers
      syncLive(k,next);
    });
    LIVE.lastTick=Date.now();
    shadowUpdate();
    if(resolveAllPaper()) render(); else paintLive();
  }).catch(function(){}).then(function(){LIVE.inflight=false;});
}

// Push live values back into the stored token objects and open trades.
function syncLive(key,v){
  function upd(p){
    if(!p||!p.baseToken)return;
    if(liveKey(p.chainId,p.baseToken.address)!==key)return;
    p.priceUsd=String(v.px);
    p.priceChange=p.priceChange||{};
    p.priceChange.m5=v.m5;p.priceChange.h1=v.h1;p.priceChange.h6=v.h6;p.priceChange.h24=v.h24;
    p.liquidity=p.liquidity||{};p.liquidity.usd=v.liq;
  }
  [S.passed,S.unverified,S.heat,S.heatUnverified,S.fresh,S.freshUnverified].forEach(function(arr){
    (arr||[]).forEach(upd);
  });
  Object.keys(S.watchData).forEach(function(a){upd(S.watchData[a]);});
  if(S.lookup)upd(S.lookup);
  S.trades.forEach(function(t){
    if(t.status==="open"&&liveKey(t.chain,t.addr)===key){t.live=v.px;t.liveAt=v.at;}
  });
}

// Patch only the price nodes. No re-render, so scroll and inputs survive.
function paintLive(){
  var nodes=document.querySelectorAll?document.querySelectorAll("[data-live]"):[];
  Array.prototype.forEach.call(nodes,function(el){
    var k=el.getAttribute("data-live");
    var f=el.getAttribute("data-livefield")||"px";
    var v=LIVE.prices[k];
    if(!v)return;
    var txt, col=null;
    if(f==="px"){ txt=px(v.px); col=v.dir>0?"var(--frog)":v.dir<0?"var(--red)":null; }
    else if(f==="liq"){ txt=compact(v.liq); }
    else { var n2=v[f]; if(n2==null)return;
      txt=(n2>=0?"+":"")+n2.toFixed(1)+"%"; col=n2>=0?"var(--frog)":"var(--red)"; }
    if(el.textContent!==txt){
      el.textContent=txt;
      if(col)el.style.color=col;
      // brief flash so a change is noticeable without being distracting
      el.style.transition="none";
      el.style.background=v.dir>0?"rgba(110,232,90,.22)":v.dir<0?"rgba(255,107,122,.22)":"transparent";
      setTimeout(function(){el.style.transition="background .8s";el.style.background="transparent";},40);
    }
  });
  var stamp=document.getElementById("liveStamp");
  if(stamp)stamp.textContent=LIVE.lastTick?new Date(LIVE.lastTick).toLocaleTimeString():"—";
}

function startLive(){
  if(LIVE.running||IS_LOCAL_FILE)return;
  LIVE.running=true;
  liveTick();
  LIVE.timer=setInterval(function(){
    if(typeof document!=="undefined"&&document.hidden)return;   // pause off-screen
    liveTick();
  },Math.max(3,S.cfg.liveIntervalSec)*1000);
}
function stopLive(){
  LIVE.running=false;
  if(LIVE.timer)clearInterval(LIVE.timer);
  LIVE.timer=null;
}
function restartLive(){stopLive();if(S.cfg.liveEnabled)startLive();}

var DEFINED_SLUG={
  ethereum:"eth", bsc:"bsc", polygon:"polygon", arbitrum:"arb", optimism:"optimism",
  avalanche:"avax", base:"base", fantom:"fantom", solana:"sol", blast:"blast",
  linea:"linea", zksync:"zksync", scroll:"scroll", mantle:"mantle", cronos:"cronos",
  sui:"sui", ton:"ton", sonic:"sonic", berachain:"berachain", unichain:"unichain",
  pulsechain:"pulsechain", opbnb:"opbnb", gnosis:"gnosis"
};
// Defined.fi routes by network slug + PAIR address, not the token address.
// Fall back to their search if no pair address is available.
// Defined rebuilt their platform; the chart URLs that use network + pair
// address now live on un.defined.fi (their "Classic" continuation). Building
// against www.defined.fi returns 404. If no pair address is known there is no
// valid direct URL, so fall back to DexScreener rather than a dead link.
function definedUrl(p){
  var slug=DEFINED_SLUG[p.chainId], pair=p.pairAddress||"";
  if(slug&&pair) return "https://un.defined.fi/"+slug+"/"+encodeURIComponent(pair);
  return dexUrl(p.chainId,(p.baseToken&&p.baseToken.address)||"");
}
function definedUrlFromTrade(t){
  var slug=DEFINED_SLUG[t.chain];
  if(slug&&t.pair) return "https://un.defined.fi/"+slug+"/"+encodeURIComponent(t.pair);
  return dexUrl(t.chain,t.addr||"");
}
// DexScreener accepts either a pair or a token address on every chain it
// covers, which makes it a reliable fallback and a working trade link.
function dexUrl(chain,addr){
  return "https://dexscreener.com/"+encodeURIComponent(chain||"ethereum")+"/"+encodeURIComponent(addr||"");
}

function copyCA(a,btn){
  function ok(){btn.textContent="Copied";setTimeout(function(){btn.textContent="Copy";},1400);}
  if(navigator.clipboard&&navigator.clipboard.writeText)
    navigator.clipboard.writeText(a).then(ok).catch(fb);else fb();
  function fb(){var t=document.createElement("textarea");t.value=a;t.style.position="fixed";
    t.style.opacity="0";document.body.appendChild(t);t.select();
    try{document.execCommand("copy");ok();}catch(e){}document.body.removeChild(t);}
}

// Groups the reasons tokens were rejected so the user can see at a glance
// which filter is doing the blocking, instead of scrolling 19 cards.
function blockReasonSummary(){
  var counts={};
  S.blocked.forEach(function(p){
    (p._gate.blockers||[]).forEach(function(b){
      // normalise variable text (percentages, sizes) into a stable label
      var key=b.replace(/[\d.]+%/g,"%").replace(/\$[\d.,KMB]+/gi,"$X")
              .replace(/top10 %/,"top-10 holders too concentrated")
              .replace(/fee drag %/,"fees too high for your stake");
      counts[key]=(counts[key]||0)+1;
    });
  });
  return Object.keys(counts).map(function(k){return {r:k,n:counts[k]};})
    .sort(function(a,b){return b.n-a.n;});
}

// Suggests which specific setting to change, based on what actually blocked.
function relaxAdvice(top){
  var r=(top&&top.r||"").toLowerCase();
  if(r.indexOf("unverified")>=0||r.indexOf("no security data")>=0)
    return {t:"Turn OFF Strict mode",d:"Most rejections are things the security APIs simply have no record of — common for very new tokens.",k:"strict"};
  if(r.indexOf("lp")>=0||r.indexOf("liquidity locked")>=0||r.indexOf("lock")>=0)
    return {t:"Turn OFF Require locked liquidity",d:"Many legitimate tokens don't report lock status in a way these APIs can read. Riskier, but it's what's blocking you.",k:"lp"};
  if(r.indexOf("top-10")>=0||r.indexOf("top10")>=0)
    return {t:"Raise Max top-10 holder %",d:"New tokens are usually concentrated. Try 60-70% instead of "+S.cfg.maxTop10+"%.",k:"top10"};
  if(r.indexOf("thin")>=0||r.indexOf("liquidity")>=0)
    return {t:"Lower the liquidity requirement",d:"Reduce 'liquidity needed per $1' or the absolute floor in Settings.",k:"liq"};
  if(r.indexOf("fee")>=0||r.indexOf("drag")>=0)
    return {t:"Raise Max total cost, or increase your stake",d:"At "+usd(S.cfg.sizeUsd)+" even small gas fees are a big share. $5-$10 gives more room.",k:"fee"};
  if(r.indexOf("too new")>=0)
    return {t:"Lower Min pair age",d:"Boosted tokens are often brand new. Note that under ~2h is genuinely the riskiest window.",k:"age"};
  if(r.indexOf("liq/fdv")>=0)
    return {t:"These have thin liquidity vs valuation",d:"That check catches tokens priced far above what backs them. Worth keeping on.",k:null};
  return null;
}

function applyRelax(kind){
  var c=S.cfg;
  if(kind==="strict") c.strict=false;
  else if(kind==="lp") c.requireLpLock=false;
  else if(kind==="top10") c.maxTop10=Math.min(85,c.maxTop10+25);
  else if(kind==="liq"){ c.liqMultiple=Math.max(50,c.liqMultiple/2); c.minLiqFloor=Math.max(2000,c.minLiqFloor/2); }
  else if(kind==="fee") c.maxFeeDragPct=Math.min(50,c.maxFeeDragPct+15);
  else if(kind==="age") c.minAgeH=0;
}

// ===========================================================================
// PARABOLIC PROFILE MATCH
//
// The conviction score is a weighted average, which means a token can score
// well while missing the specific combination that actually precedes big
// moves. This checks that combination directly: small enough to multiply,
// accelerating right now, buyers in control, and enough liquidity to exit.
// A match is a stronger signal than the raw number alone.
// ===========================================================================
function profileMatch(p){
  var f=p._cv&&p._cv.f; if(!f)return null;
  var hits=[],misses=[];
  function chk(cond,yes,no){ if(cond)hits.push(yes); else misses.push(no); }

  chk(f.room>=70,  "room to multiply",        "valuation already large");
  chk(f.accel>=60, "activity accelerating",   "activity not building");
  chk(f.flow>=60,  "buyers in control",       "buy pressure weak");
  chk(f.turn>=55,  "real volume for its size","volume light");
  chk(f.liq>=45,   "exitable liquidity",      "liquidity thin");
  chk(f.dist>=50,  "supply spread out",       "supply concentrated");

  return {n:hits.length, total:6, hits:hits, misses:misses,
          strong:hits.length>=5 && !p._cv.capped};
}

function buyPlanHTML(p){
  var cv=p._cv, econ=p._econ;
  if(!cv||!econ)return "";
  var price=num(p.priceUsd);
  var stop=price*(1-S.cfg.stopPct/100);
  var size=S.cfg.sizeUsd;
  var sym=(p.baseToken&&p.baseToken.symbol)||"this token";
  var slip=Math.max(1,Math.ceil(econ.impact.roundPct)+1);
  var steps=S.cfg.tp.slice().sort(function(a,b){return a-b;});

  var h='<div style="margin-top:14px;border:1.5px solid var(--frog);border-radius:11px;overflow:hidden">'+
    '<div style="padding:12px 14px;background:#0D2109;font-size:13px;text-transform:uppercase;'+
    'letter-spacing:.09em;color:var(--frog);font-weight:800">\u2192 Your buy plan</div>'+
    '<div style="padding:14px;font-size:14.5px;line-height:1.75;color:var(--text)">'+
    '<b>1. Buy</b> '+usd(size)+' of '+esc(sym)+' at about '+px(price)+'<br>'+
    '<span style="color:var(--dim);font-size:13.5px">Set slippage to ~'+slip+'% in your wallet or DEX. '+
    'Expect roughly '+usd(econ.totalUsd)+' total in fees and slippage.</span><br><br>'+

    '<b>2. Set your stop</b> at '+px(stop)+'<br>'+
    '<span style="color:var(--dim);font-size:13.5px">That\'s \u2212'+S.cfg.stopPct+'%. '+
    'If it hits, you exit with about '+usd(size*(1-S.cfg.stopPct/100))+' left of your '+usd(size)+'.</span><br><br>'+

    '<b>3. Sell in steps on the way up</b><br>';

  // Track the fraction still held so each step's cash-out is the real number,
  // not a percentage of the original position that no longer exists.
  var remainFrac=1, cumulative=0;
  steps.forEach(function(m,i){
    var sellPct=i===0?50:25;
    var at=price*m;
    var soldFrac=remainFrac*(sellPct/100);
    var take=size*soldFrac*m;
    remainFrac-=soldFrac;
    cumulative+=take;
    h+='<span style="color:var(--frog)">\u2022 At '+px(at)+' ('+m+'x) \u2014 sell '+sellPct+
       '% of what\'s left, taking about '+usd(take)+'</span>'+
       (i===0?' <span style="color:var(--dim);font-size:13px">\u2190 this alone returns your '+usd(size)+' stake</span>':'')+'<br>';
  });
  h+='<span style="color:var(--dim);font-size:13.5px">If it reached every step you\'d have taken out about '+
     usd(cumulative)+' from a '+usd(size)+' entry, still holding '+(remainFrac*100).toFixed(0)+'%.</span><br>';

  h+='<br><b>4. Trade it</b> \u2014 <a href="'+esc(p.url||dexUrl(p.chainId,(p.baseToken&&p.baseToken.address)||""))+
     '" target="_blank" rel="noopener" style="color:var(--frog);font-weight:700;text-decoration:underline">'+
     'open '+esc(sym)+' \u2197</a>'+
     ' <span style="color:var(--dim);font-size:13px">or <a href="'+esc(definedUrl(p))+
     '" target="_blank" rel="noopener" style="color:var(--glass)">on Defined \u2197</a></span>'+
     '<br><b>5. Log it</b> with the button below, then turn on <b>Watch my exits</b> in the Log tab '+
     'so you get told exactly when each step triggers.'+
     '<br><br><span style="color:var(--dim);font-size:13px">This plan comes from the settings you set, '+
     'not from a prediction. Most tokens don\'t reach step 3.</span>'+
     '</div></div>';
  return h;
}

  if(S.localBlocked)return h+localFileNotice();
  if(S.error)return h+'<div class="banner err code">Scan failed:\n\n'+esc(S.error)+'\n\nTap to retry. Free APIs rate-limit — wait a minute if it repeats.</div>';
  if(S.loading)return h+'<div class="empty"><div class="spinner"></div>'+esc(S.progress||"Working…")+

    h+='<div class="banner info"><b>Scan coverage</b><br><br>'+
      '<div style="display:flex;justify-content:space-between;padding:3px 0"><span>Pairs found across '+cv.chains+' chains</span><b style="color:#fff">'+cv.found+'</b></div>'+
      '<div style="display:flex;justify-content:space-between;padding:3px 0"><span>Passed pre-filter (liquidity, volume, age)</span><b style="color:#fff">'+cv.screened+'</b></div>'+
      '<div style="display:flex;justify-content:space-between;padding:3px 0"><span>Deep-audited (contract security)</span><b style="color:#fff">'+cv.audited+'</b></div>'+
      '<div style="display:flex;justify-content:space-between;padding:3px 0"><span>Search queries run</span><b style="color:#fff">53</b></div>'+
      (cv.screened>cv.audited?'<br><span style="color:var(--dim)">'+(cv.screened-cv.audited)+' more qualified but weren\'t audited — raise the audit limit in Settings to include them.</span>':'')+

    '<div style="display:flex;justify-content:space-between;align-items:baseline;gap:10px">'+
    '<span style="font-family:var(--mono);font-size:13.5px;color:'+col+';font-weight:700">'+
    '\ud83d\udcc8 '+esc(heatLabel(hs))+'</span>'+
    '<span style="font-family:var(--mono);font-size:13px;color:var(--dim)">heat '+hs.score+'/100</span></div>'+
    '<div style="margin-top:6px;font-size:13.5px;color:var(--text2);line-height:1.6">'+
    'Last hour running <b>'+hs.accel6.toFixed(1)+'x</b> its 6h pace'+
    (hs.accel24>1?', 6h running <b>'+hs.accel24.toFixed(1)+'x</b> its daily pace':'')+
    '. Buyers '+(hs.flow1*100).toFixed(0)+'% of trades this hour. Price '+
    (hs.h24>=0?"+":"")+hs.h24.toFixed(0)+'% today.</div>';
  if(cf){
    var lg=cf.liqGrowth, vg=cf.volGrowth;
    h+='<div style="margin-top:6px;font-size:13.5px;color:'+
      ((lg!=null&&lg<-10)?"var(--red)":"var(--frog)")+'">'+
      'Tracked '+(cf.minutes<90?Math.round(cf.minutes)+"m":Math.round(cf.minutes/60)+"h")+': '+
      (vg!=null?'volume '+(vg>=0?"+":"")+vg.toFixed(0)+'%':'')+
      (lg!=null?', liquidity '+(lg>=0?"+":"")+lg.toFixed(0)+'%':'')+'</div>';

  return h+cardHTML(p,false);
}

function watchPane(){
  var h='<div class="field"><label>Track a token</label>'+
    '<input id="watchIn" placeholder="Paste contract address\u2026" autocapitalize="off" '+
    'autocorrect="off" spellcheck="false" value="'+esc(S.watchInput)+'" />'+
    '<div class="hint">Saved on this device. Tap refresh any time to re-audit and re-grade everything.</div></div>'+
    '<div class="toolbar"><button class="primary" id="watchAdd">Add to watchlist</button>'+
    (S.watch.length?'<button id="watchRef">'+(S.watchLoading?"Refreshing…":"Refresh all")+'</button>':'')+'</div>';

  if(S.watchErr)h+='<div class="banner err">'+esc(S.watchErr)+'</div>';
  if(S.localBlocked)return h+localFileNotice();

  if(!S.watch.length){
    h+='<div class="empty">Nothing tracked yet.<br><br>When you see a token mentioned anywhere \u2014 a group chat, a video, a friend \u2014 paste the address here to audit and grade it, then keep an eye on it.</div>';
  } else {
    // Ranked best-first like every other list; unloaded/errored entries last.
    var loaded=[],pending=[];
    S.watch.forEach(function(a){
      var d=S.watchData[a];
      if(d&&!d._err&&d._cv)loaded.push({addr:a,d:d}); else pending.push({addr:a,d:d});
    });
    loaded.sort(function(x,y){return y.d._cv.total-x.d._cv.total;});

      var a=item.addr,d=item.d;
      if(!d){h+='<div class="card"><div class="ca"><code>'+esc(a)+'</code>'+
        '<button data-copy="'+esc(a)+'">Copy</button></div>'+
