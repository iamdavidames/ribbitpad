function journalPane(){
  var st=journalStats();
  var h='<div class="toolbar">'+
    '<button class="primary" id="trRef">'+(S.tradesLoading?"Updating…":"Update prices")+'</button>'+
    (S.trades.length?'<button id="trCsv">Export CSV</button>':'')+'</div>';

  var openN=S.trades.filter(function(t){return t.status==="open";}).length;
  if(openN){
    h+='<div class="toolbar" style="padding-top:0">'+
      '<button class="'+(S.watching?"":"primary")+'" id="watchToggle">'+
      (S.watching?"\u23f8 Stop watching":"\ud83d\udd14 Watch my exits")+'</button>'+
      (S.notifOk?'':'<button id="notifBtn">Enable alerts</button>')+'</div>';
    if(S.watching)
      h+='<div class="banner info">Checking your '+openN+' open position'+(openN>1?"s":"")+
         ' every minute. You\'ll be alerted at your stop and each target. <b>Keep this tab open</b> \u2014 '+
         'there is no server, so it can\'t reach you once the page is closed.</div>';
  }

  // "Do this now" — collapses every open position into concrete actions,
  // sorted by urgency, so there is never a question of what to act on first.
  var actions=[];
  S.trades.filter(function(t){return t.status==="open";}).forEach(function(t){
    if(!t.live||!t.entry)return;
    var pct=((t.live-t.entry)/t.entry)*100;
    var stop=t.entry*(1-t.stopPct/100);
    var mult=t.live/t.entry;
    var value=t.size*mult;
    var steps=t.tps.slice().sort(function(a,b){return a-b;});
    var hitIdx=-1;
    steps.forEach(function(m,i){if(mult>=m)hitIdx=i;});

    if(t.live<=stop){
      actions.push({u:0,sym:t.sym,act:"SELL ALL",price:t.live,
        why:"past your "+t.stopPct+"% stop \u2014 worth "+usd(value)+" now",col:"var(--red)"});
    } else if(hitIdx>=0){
      var sp=hitIdx===0?50:25;
      actions.push({u:1,sym:t.sym,act:"SELL "+sp+"%",price:t.live,
        why:"hit "+steps[hitIdx]+"x \u2014 takes "+usd(value*sp/100)+" off the table",col:"var(--frog)"});
    } else if(pct<=-(t.stopPct*0.7)){
      actions.push({u:2,sym:t.sym,act:"WATCH CLOSELY",price:t.live,
        why:pct.toFixed(0)+"%, stop at "+px(stop),col:"var(--amber)"});
    } else {
      actions.push({u:3,sym:t.sym,act:"HOLD",price:t.live,
        why:(pct>=0?"+":"")+pct.toFixed(0)+"% \u2014 next target "+
          (steps.filter(function(m){return mult<m;})[0]||"\u2014")+"x at "+
          px(t.entry*(steps.filter(function(m){return mult<m;})[0]||1)),col:"var(--dim)"});
    }
  });
  actions.sort(function(a,b){return a.u-b.u;});

  if(actions.length){
    var urgent=actions.filter(function(a){return a.u<=1;}).length;
    h+='<div style="margin:16px 18px;border:1.5px solid '+(urgent?"var(--frog)":"var(--line)")+
      ';border-radius:11px;overflow:hidden">'+
      '<div style="padding:12px 14px;background:'+(urgent?"#0D2109":"var(--raised)")+
      ';font-size:13px;text-transform:uppercase;letter-spacing:.09em;font-weight:800;color:'+
      (urgent?"var(--frog)":"var(--text2)")+'">Do this now'+(urgent?" \u2014 "+urgent+" need action":"")+'</div>';
    actions.forEach(function(a){
      h+='<div style="padding:13px 14px;border-bottom:1px solid var(--line)">'+
        '<div style="display:flex;justify-content:space-between;gap:12px;align-items:baseline">'+
        '<span style="font-weight:800;font-size:16px;color:'+a.col+'">'+esc(a.act)+' '+esc(a.sym)+'</span>'+
        '<span class="mono" style="font-size:14px">'+px(a.price)+'</span></div>'+
        '<div style="font-size:13.5px;color:var(--dim);margin-top:4px">'+esc(a.why)+'</div></div>';
    });
    h+='</div>';
  }

  if(S.alerts.length){
    h+='<div class="factors" style="margin:16px 18px"><div class="hd"><span>Alert history</span><span>most recent first</span></div>';
    S.alerts.slice(0,6).forEach(function(a){
      var c=a.kind==="stop"?"var(--red)":a.kind==="near"?"var(--amber)":"var(--frog)";
      h+='<div class="chk"><span class="ic" style="color:'+c+'">'+
         (a.kind==="stop"?"\u2715":a.kind==="near"?"!":"\u2713")+'</span>'+
         '<span class="tx"><b>'+esc(a.sym)+'</b> \u2014 '+esc(a.msg)+'</span>'+
         '<span class="vl">'+new Date(a.at).toLocaleTimeString()+'</span></div>';
    });

        rs.open+' / '+S.cfg.maxOpenPositions+'</span></div>'+
      '<div class="feerow"><span class="fk">Money deployed</span><span'+(rs.overExposure?' style="color:var(--red)"':'')+'>'+
        usd(rs.exposure)+' / '+usd(S.cfg.maxExposureUsd)+'</span></div>'+
      '<div class="feerow"><span class="fk">At risk if every stop hits</span><span class="down">'+usd(rs.atRisk)+'</span></div>'+
      '<div class="feebig"><span class="fkb">Last 24h realised</span><span style="color:'+
        (rs.todayPnl>=0?"var(--frog)":"var(--red)")+'">'+(rs.todayPnl>=0?"+":"")+usd(rs.todayPnl)+'</span></div></div>';

    else if(rs.overExposure)
      h+='<div class="banner warn">You have '+usd(rs.exposure)+' deployed, over your '+
         usd(S.cfg.maxExposureUsd)+' limit.</div>';

  if(S.journalNote){h+='<div class="banner info">'+esc(S.journalNote)+'</div>';S.journalNote=null;}

  if(!S.trades.length){

      'Most people can\'t say what their actual hit rate is, so they never find out whether their approach works \u2014 they just watch the balance move. Logging every entry turns that into real numbers: win rate, average win vs average loss, and expectancy (average dollars per trade).<br><br>'+
      'Expectancy is the one that matters. Positive means the approach pays over repetition. Negative means it doesn\'t, no matter how good any single trade felt.</div>'+
      '<div class="empty">No trades logged yet.<br><br>When you buy something, tap <b>Log this trade</b> on its card in Scan, New, or Watch.</div>';
  }

  if(st){
    var pc=st.totalPnl>=0?"var(--frog)":"var(--red)";
    var ec=st.expectancy>=0?"var(--frog)":"var(--red)";
    h+='<div class="feebox" style="margin:16px 18px"><div class="fh">Your performance \u2014 '+st.n+' closed trades</div>'+
      '<div class="feerow"><span class="fk">Win rate</span><span>'+st.winRate.toFixed(0)+'% ('+st.wins+'W / '+st.losses+'L)</span></div>'+
      '<div class="feerow"><span class="fk">Average win</span><span class="up">'+usd(st.avgWin)+'</span></div>'+
      '<div class="feerow"><span class="fk">Average loss</span><span class="down">'+usd(st.avgLoss)+'</span></div>'+

  });
  return h;

// ===========================================================================
// FIND SIMILAR
//
// Important subtlety: a token that already ran looks nothing like it did
// before it ran. Its FDV is now large and its chart is already vertical.
// Filtering on its CURRENT state finds tops, not entries.
//
// So this reconstructs what the token plausibly looked like BEFORE the move
// — same chain, same launch-window, but at the small-FDV end where it started
// — and applies that as scan filters. It matches the setup, not the outcome.
// ===========================================================================
function similarProfile(p){
  var fdv=num(p.fdv||p.marketCap);
  var liq=num(p.liquidity&&p.liquidity.usd);
  var age=ageH(p.pairCreatedAt);
  var ratio=fdv>0?liq/fdv:0;
  var ch24=num(p.priceChange&&p.priceChange.h24);
  var ran = ch24>60 || fdv>2000000;

  // Estimate the pre-move FDV band. If it's up a lot, wind it back.
  var preFdv = ran ? fdv/Math.max(1+ch24/100, 3) : fdv;
  var lo=Math.max(20000, preFdv*0.35), hi=Math.max(lo*3, preFdv*2.5);

  return {
    chain:p.chainId,
    fdvLo:lo, fdvHi:hi,
    liqRatio:ratio,
    ageWindow: age!=null && age<168 ? "new" : "established",
    alreadyRan:ran,
    ch24:ch24, fdv:fdv, liq:liq, age:age
  };
}

function applySimilar(p){
  var pr=similarProfile(p);
  S.chain=pr.chain;
  // aim the scan at the FDV band this token likely occupied pre-move
  S.cfg.minLiqFloor=Math.max(4000, Math.round(pr.fdvLo*0.04));
  S.cfg.freshMinLiq=Math.max(3000, Math.round(pr.fdvLo*0.03));
  if(pr.ageWindow==="new"){ S.cfg.freshMaxAgeH=168; S.cfg.minAgeH=1; }
  S.cfg.minVol=Math.max(3000, Math.round(pr.fdvLo*0.05));
  saveCfg();
  S.similarNote=pr;
  S.tab = pr.ageWindow==="new" ? "fresh" : "scan";
  if(pr.ageWindow==="new") runFresh(); else runScan();
}

// Saving several winners and hunting what they SHARE is far more meaningful
// than copying one. A single token is a sample of one — its FDV band could be
// coincidence. Traits that recur across three or four are at least a pattern.
function addHunt(p){
  var pr=similarProfile(p);
  var sym=(p.baseToken&&p.baseToken.symbol)||"?";
  S.hunts.unshift({
    id:String(Date.now())+"-"+Math.random().toString(36).slice(2,9),
    sym:sym, addr:(p.baseToken&&p.baseToken.address)||"",
    chain:pr.chain, fdvLo:pr.fdvLo, fdvHi:pr.fdvHi,
    liqRatio:pr.liqRatio, ageWindow:pr.ageWindow,
    fdvAtSave:pr.fdv, ranAtSave:pr.alreadyRan, added:Date.now()
  });
  if(S.hunts.length>12)S.hunts.length=12;
  saveHunts();
  S.journalNote=sym+" saved. Save a few winners and hunt what they have in common.";
  render();
}
function removeHunt(id){ S.hunts=S.hunts.filter(function(x){return x.id!==id;}); saveHunts(); render(); }

// Build the overlap across every saved profile.
function compositeHunt(){
  if(!S.hunts.length)return null;
  var chains={};
  S.hunts.forEach(function(x){chains[x.chain]=(chains[x.chain]||0)+1;});
  var topChain=Object.keys(chains).sort(function(a,b){return chains[b]-chains[a];})[0];
  var agree=chains[topChain];

  // Use the median band rather than the mean so one outlier can't drag it.
  var los=S.hunts.map(function(x){return x.fdvLo;}).sort(function(a,b){return a-b;});
  var his=S.hunts.map(function(x){return x.fdvHi;}).sort(function(a,b){return a-b;});
  var med=function(a){var m=Math.floor(a.length/2);
    return a.length%2?a[m]:(a[m-1]+a[m])/2;};
  var ratios=S.hunts.map(function(x){return x.liqRatio;}).filter(function(r){return r>0;}).sort(function(a,b){return a-b;});
  var newCount=S.hunts.filter(function(x){return x.ageWindow==="new";}).length;

  return {
    n:S.hunts.length,
    chain: agree>=Math.ceil(S.hunts.length/2) ? topChain : "all",
    chainAgree:agree,
    fdvLo:med(los), fdvHi:med(his),
    liqRatio: ratios.length?med(ratios):0,
    preferNew: newCount > S.hunts.length/2
  };
}

function applyComposite(){
  var c=compositeHunt(); if(!c)return;
  S.chain=c.chain;
  S.cfg.minLiqFloor=Math.max(4000,Math.round(c.fdvLo*Math.max(c.liqRatio,0.03)));
  S.cfg.freshMinLiq=Math.max(3000,Math.round(c.fdvLo*0.03));
  S.cfg.minVol=Math.max(3000,Math.round(c.fdvLo*0.05));
  if(c.preferNew){S.cfg.freshMaxAgeH=168;S.cfg.minAgeH=1;}
  saveCfg();
  S.similarNote={chain:c.chain,fdvLo:c.fdvLo,fdvHi:c.fdvHi,
    ageWindow:c.preferNew?"new":"established",alreadyRan:false,composite:c};
  S.tab=c.preferNew?"fresh":"scan";
  if(c.preferNew)runFresh(); else runScan();
}

    b.onclick=function(){
      var id=b.getAttribute("data-hunt");
      var x=S.hunts.filter(function(y){return y.id===id;})[0];
      if(!x)return;
      S.chain=x.chain;
      S.cfg.minLiqFloor=Math.max(4000,Math.round(x.fdvLo*Math.max(x.liqRatio,0.03)));
      S.cfg.freshMinLiq=Math.max(3000,Math.round(x.fdvLo*0.03));
      S.cfg.minVol=Math.max(3000,Math.round(x.fdvLo*0.05));
      saveCfg();
      S.similarNote={chain:x.chain,fdvLo:x.fdvLo,fdvHi:x.fdvHi,
        ageWindow:x.ageWindow,alreadyRan:x.ranAtSave,ch24:0,fdv:x.fdvAtSave};
      S.tab=x.ageWindow==="new"?"fresh":"scan";
      if(x.ageWindow==="new")runFresh(); else runScan();
    };});
  var dl=document.getElementById("doLookup");
  if(dl)dl.onclick=function(){var e=document.getElementById("caInput");
    S.lastQuery=e?e.value:"";lookupOne(S.lastQuery);};
  var ci=document.getElementById("caInput");
  if(ci)ci.onkeydown=function(e){if(e.key==="Enter"){S.lastQuery=ci.value;lookupOne(ci.value);}};

  function bind(id,k){var el=document.getElementById(id);
    if(el)el.onclick=function(){S.cfg[k]=!S.cfg[k];saveCfg();render();};}
  bind("swStrict","strict");bind("swLp","requireLpLock");bind("swHide","hideBlocked");

  var sv=document.getElementById("saveCfg");
  if(sv)sv.onclick=function(){
    function gv(id,d,min){var e=document.getElementById(id);var v=e?parseFloat(e.value):NaN;
      return isFinite(v)&&v>=(min===undefined?0:min)?v:d;}
    var c=S.cfg;
    c.auditLimit=Math.min(200,Math.max(10,gv("cAudit",c.auditLimit,10)));
    c.maxCreatorPct=Math.max(1,gv("cCreator",c.maxCreatorPct,1));
    c.maxOpenPositions=Math.max(1,gv("cMaxPos",c.maxOpenPositions,1));
    c.maxExposureUsd=Math.max(1,gv("cMaxExp",c.maxExposureUsd,1));
    c.dailyLossLimit=Math.max(1,gv("cDayLoss",c.dailyLossLimit,1));
    c.freshMinAgeH=gv("cFreshMin",c.freshMinAgeH);
    c.freshMaxAgeH=Math.max(1,gv("cFreshMax",c.freshMaxAgeH,1));
    c.freshMinLiq=gv("cFreshLiq",c.freshMinLiq);
    c.maxFeeDragPct=gv("cDrag",c.maxFeeDragPct,0.5);
    c.liqMultiple=gv("cLiqM",c.liqMultiple,1);
    c.minLiqFloor=gv("cLiqF",c.minLiqFloor,0);
    c.stopPct=Math.min(95,gv("cStop",c.stopPct,1));
    c.maxBuyTax=gv("cBuyTax",c.maxBuyTax);c.maxSellTax=gv("cSellTax",c.maxSellTax);
    c.maxTop10=gv("cTop10",c.maxTop10,1);c.minVol=gv("cVol",c.minVol);
    c.minAgeH=gv("cMinAge",c.minAgeH);c.maxAgeH=gv("cMaxAge",c.maxAgeH,1);
    var t=document.getElementById("cTp");
    if(t){var pr=t.value.split(",").map(function(x){return parseFloat(x.trim());})
      .filter(function(x){return isFinite(x)&&x>1;});if(pr.length)c.tp=pr;}
    saveCfg();
    S.tab="scan";render();
  };
}

window.onerror=function(m,s,l,c,err){
  var a=document.getElementById("app");
  if(a)a.innerHTML='<div class="banner err code">Startup error:\n\n'+esc((err&&err.stack)||m)+'</div>';
};

render();
})();
</script>
</body>
</html>
