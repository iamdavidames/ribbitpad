        '<div class="toolbar" style="padding:12px 0 0;border:none"><button data-unwatch="'+esc(a)+'">Remove</button></div></div>';return;}
      if(d._err){h+='<div class="card"><div class="ca"><code>'+esc(a)+'</code>'+
        '<button data-copy="'+esc(a)+'">Copy</button></div>'+
        '<div style="margin-top:10px;color:var(--red);font-size:14px">'+esc(d._err)+'</div>'+
        '<div class="toolbar" style="padding:12px 0 0;border:none"><button data-unwatch="'+esc(a)+'">Remove</button></div></div>';return;}
      h+=cardHTML(d,d._gate.verdict==="block");
      h+='<div class="toolbar" style="padding:0 18px 16px;border:none"><button data-unwatch="'+esc(a)+'">Remove from watchlist</button></div>';
    });

  // ---- wallet tracking ----

    '<input id="walIn" placeholder="Paste wallet address\u2026" autocapitalize="off" '+
    'autocorrect="off" spellcheck="false" value="'+esc(S.walletInput)+'" />'+
    '<div class="hint">Saves the address and gives you one-tap links to see what it\'s been buying.</div></div>'+
    '<div class="toolbar"><button class="primary" id="walAdd">Save wallet</button></div>';

  h+='<div class="banner warn"><b>Why this isn\'t automatic.</b> Ranking wallets by success rate needs indexed on-chain data with profit/loss attribution \u2014 that\'s paid infrastructure (Nansen, Arkham, Cielo), not something a free site can compute. These links take you straight to free explorers where you can see a wallet\'s recent buys yourself, then paste any interesting token into the watchlist above.</div>';

  if(S.wallets.length){
    S.wallets.forEach(function(a){
      h+='<div class="card"><div class="mono" style="font-size:13px;word-break:break-all;color:var(--text2)">'+esc(a)+'</div><div class="links">';
      walletLinks(a).forEach(function(L){
        h+='<a href="'+esc(L[1])+'" target="_blank" rel="noopener">'+esc(L[0])+' \u2197</a>';
      });
      h+='</div><div class="toolbar" style="padding:12px 0 0;border:none"><button data-unwallet="'+esc(a)+'">Remove</button></div></div>';
    });

function journalPane(){
  var st=journalStats();
  var pst=journalStats("paper");
  var h='<div class="toolbar">'+
    '<button class="primary" id="trRef">'+(S.tradesLoading?"Updating…":"Update prices")+'</button>'+
    (S.trades.length?'<button id="showStats">\ud83d\udcca What\u2019s working</button>':'')+
    (S.trades.length?'<button id="trCsv">CSV</button>':'')+'</div>';

  if(S.showStats){
    return '<div class="toolbar"><button class="primary" id="backJournal">\u2190 Back to trades</button></div>'+
      ladderPanelHTML()+weightsPanelHTML()+filterAuditHTML()+learnPanelHTML()+shadowPanelHTML();
  }

  var openN=S.trades.filter(function(t){return t.status==="open";}).length;
  if(openN){
    h+='<div class="toolbar" style="padding-top:0">'+
      '<button class="'+(S.watching?"":"primary")+'" id="watchToggle">'+
      (S.watching?"\u23f8 Stop watching":"\ud83d\udd14 Watch my exits")+'</button>'+
      (S.notifOk?'':'<button id="notifBtn">Enable alerts</button>')+'</div>';
    if(S.watching)
      h+='<div class="banner info">Checking your '+openN+' open position'+(openN>1?"s":"")+
         ' every minute. You\'ll be alerted at your stop and each target. <b>Keep this tab open</b> \u2014 '+
         'there is no server, so it can\'t reach you once the page is closed.</div>';
  }

  // "Do this now" — collapses every open position into concrete actions,
  // sorted by urgency, so there is never a question of what to act on first.
  var actions=[];
  S.trades.filter(function(t){return t.status==="open";}).forEach(function(t){
    if(!t.live||!t.entry)return;
    var pct=((t.live-t.entry)/t.entry)*100;
    var stop=t.entry*(1-t.stopPct/100);
    var mult=t.live/t.entry;
    var value=t.size*mult;
    var steps=t.tps.slice().sort(function(a,b){return a-b;});
    var hitIdx=-1;
    steps.forEach(function(m,i){if(mult>=m)hitIdx=i;});

    if(t.live<=stop){
      actions.push({u:0,sym:t.sym,addr:t.addr,chain:t.chain,pair:t.pair,act:"SELL ALL",price:t.live,
        why:"past your "+t.stopPct+"% stop \u2014 worth "+usd(value)+" now",col:"var(--red)"});
    } else if(hitIdx>=0){
      var sp=hitIdx===0?50:25;
      actions.push({u:1,sym:t.sym,addr:t.addr,chain:t.chain,pair:t.pair,act:"SELL "+sp+"%",price:t.live,
        why:"hit "+steps[hitIdx]+"x \u2014 takes "+usd(value*sp/100)+" off the table",col:"var(--frog)"});
    } else if(pct<=-(t.stopPct*0.7)){
      actions.push({u:2,sym:t.sym,addr:t.addr,chain:t.chain,pair:t.pair,act:"WATCH CLOSELY",price:t.live,
        why:pct.toFixed(0)+"%, stop at "+px(stop),col:"var(--amber)"});
    } else {
      actions.push({u:3,sym:t.sym,addr:t.addr,chain:t.chain,pair:t.pair,act:"HOLD",price:t.live,
        why:(pct>=0?"+":"")+pct.toFixed(0)+"% \u2014 next target "+
          (steps.filter(function(m){return mult<m;})[0]||"\u2014")+"x at "+
          px(t.entry*(steps.filter(function(m){return mult<m;})[0]||1)),col:"var(--dim)"});
    }
  });
  actions.sort(function(a,b){return a.u-b.u;});

  if(actions.length){
    var urgent=actions.filter(function(a){return a.u<=1;}).length;
    h+='<div style="margin:16px 18px;border:1.5px solid '+(urgent?"var(--frog)":"var(--line)")+
      ';border-radius:11px;overflow:hidden">'+

  if(S.journalNote){h+='<div class="banner info">'+esc(S.journalNote)+'</div>';S.journalNote=null;}

  if(!S.trades.length){

      'Expectancy is the one that matters. Positive means the approach pays over repetition. Negative means it doesn\'t, no matter how good any single trade felt.</div>'+

  }

  // ---- paper results: the whole point of the dry run ----
  if(pst){

      var unreal=valNow!=null?valNow-t.size:null;
      var stopP=t.entry*(1-t.stopPct/100);
      var toStop=lp?((lp-stopP)/lp)*100:null;
      var steps=t.tps.slice().sort(function(a,b){return a-b;});
      var nextT=steps.filter(function(m){return lp/t.entry<m;})[0];

      var col=chg==null?"var(--dim)":chg>=0?"var(--frog)":"var(--red)";

        '<span class="mono" style="font-size:19px;font-weight:800;color:'+col+'">'+

          '<div class="mono" style="font-size:15px;font-weight:700;margin-top:3px;color:'+col+'">'+
          (valNow!=null?usd(valNow):"\u2014")+'</div></div>'+
        '<div style="flex:1;padding:9px;border-radius:8px;background:var(--panel);border:1px solid var(--line)">'+

          '<div class="mono" style="font-size:15px;font-weight:700;margin-top:3px;color:'+col+'">'+

      if(lp){
        h+='<div style="margin-top:12px;font-size:13.5px;line-height:1.7;color:var(--text2)">'+

            Math.abs(toStop).toFixed(0)+'% below</b> here.':'')+
          (toTarget!=null?'<br>Next target '+nextT+'x at '+px(t.entry*nextT)+' is <b style="color:var(--frog)">'+
            toTarget.toFixed(0)+'% above</b> here.':'<br>Past every target you set.')+
          '</div>';
        if(unreal!=null&&valNow!=null&&t.costs){

        '<div class="lvl sl"><span class="lbl">Your stop \u2212'+t.stopPct+'%</span><span class="down">'+px(stopPrice)+'</span></div>';
      t.tps.forEach(function(m){

      });
      if(live&&live<=stopPrice)
        h+='<div class="lvl sl"><span class="lbl" style="color:var(--red)">\u26a0 Below your stop</span><span class="down">exit planned</span></div>';
    } else {
      h+='<div class="lvl"><span class="lbl">Exit</span><span>'+px(t.exit)+'</span></div>'+
        '<div class="lvl"><span class="lbl">Fees paid</span><span>'+usd(t.costs||0)+'</span></div>';
    }
    h+='</div>';

    if(!open) h+=postMortemHTML(t);
    if(t.paper&&t.events&&t.events.length){
      h+='<div class="factors"><div class="hd"><span>What happened</span><span>'+
        (t.remaining>0.001?(t.remaining*100).toFixed(0)+"% still held":"fully closed")+'</span></div>';
      t.events.forEach(function(ev){

        var ic=ev.kind==="stop"?"\u2715":ev.kind==="tp"?"\u2713":"\u25cf";
        h+='<div class="chk"><span class="ic" style="color:'+c+'">'+ic+'</span>'+
           '<span class="tx" style="color:'+(ev.kind==="done"?"var(--dim)":c)+'">'+esc(ev.note)+'</span>'+
           '<span class="vl">'+new Date(ev.at).toLocaleTimeString()+'</span></div>';

      var chartUrl=t.chain==="solana"

      h+='<div class="links">'+

         '<a href="https://x.com/search?q='+encodeURIComponent(t.addr)+'&f=live" target="_blank" rel="noopener">X \u2197</a></div>';
    }

    if(open&&t.paper){
      h+='<div style="margin-top:12px;padding:12px;border-radius:9px;background:var(--panel);'+

        (t.tps.slice().sort(function(a,b){return a-b;}).map(function(m,i){
          return (i===0?"50%":"25%")+" at "+m+"x";}).join(", "))+
        ', or exits everything if it falls '+t.stopPct+'%. Keep the app open so prices update.</div>'+
        '<div class="toolbar" style="padding:11px 0 0;border:none">'+
        '<button data-del="'+esc(t.id)+'">Remove</button></div>';
    }
    if(open&&!t.paper){

      h+='<div class="field" style="padding:14px 0 0"><label>What you actually paid</label>'+
        '<div class="row2">'+

          'placeholder="entry price" value="'+esc(String(t.entry))+'" />'+
        '<input class="sizeIn" data-size="'+esc(t.id)+'" inputmode="decimal" '+
          'placeholder="amount $" value="'+esc(String(t.size))+'" />'+
        '</div>'+
        '<div class="hint">Entry price and dollar amount. Everything \u2014 stop, targets, P&amp;L \u2014 '+

        '<button data-saveentry="'+esc(t.id)+'">Save entry</button></div></div>';

      h+='<div class="field" style="padding:14px 0 0"><label>Sold it? Enter your exit price</label>'+
        '<input class="exitIn" data-exit="'+esc(t.id)+'" inputmode="decimal" placeholder="e.g. 0.00084" /></div>'+
        '<div class="toolbar" style="padding:12px 0 0;border:none">'+
        '<button class="primary" data-close="'+esc(t.id)+'">Close trade</button>'+
        '<button data-del="'+esc(t.id)+'">Delete</button></div>';

        '<button data-del="'+esc(t.id)+'">Delete</button></div>';
    }
    h+='</div>';
  });

}

// ===========================================================================
// FIND SIMILAR
//
// Important subtlety: a token that already ran looks nothing like it did
// before it ran. Its FDV is now large and its chart is already vertical.
// Filtering on its CURRENT state finds tops, not entries.
//
// So this reconstructs what the token plausibly looked like BEFORE the move
// — same chain, same launch-window, but at the small-FDV end where it started
// — and applies that as scan filters. It matches the setup, not the outcome.
// ===========================================================================
function similarProfile(p){
  var fdv=num(p.fdv||p.marketCap);
  var liq=num(p.liquidity&&p.liquidity.usd);
  var age=ageH(p.pairCreatedAt);
  var ratio=fdv>0?liq/fdv:0;
  var ch24=num(p.priceChange&&p.priceChange.h24);
  var ran = ch24>60 || fdv>2000000;

  // Estimate the pre-move FDV band. If it's up a lot, wind it back.
  var preFdv = ran ? fdv/Math.max(1+ch24/100, 3) : fdv;
  var lo=Math.max(20000, preFdv*0.35), hi=Math.max(lo*3, preFdv*2.5);

  return {
    chain:p.chainId,
    fdvLo:lo, fdvHi:hi,
    liqRatio:ratio,
    ageWindow: age!=null && age<168 ? "new" : "established",
    alreadyRan:ran,
    ch24:ch24, fdv:fdv, liq:liq, age:age
  };
}

function applySimilar(p){
  var pr=similarProfile(p);
  S.chain=pr.chain;
  // aim the scan at the FDV band this token likely occupied pre-move
  S.cfg.minLiqFloor=Math.max(4000, Math.round(pr.fdvLo*0.04));
  S.cfg.freshMinLiq=Math.max(3000, Math.round(pr.fdvLo*0.03));
  if(pr.ageWindow==="new"){ S.cfg.freshMaxAgeH=168; S.cfg.minAgeH=1; }
  S.cfg.minVol=Math.max(3000, Math.round(pr.fdvLo*0.05));
  saveCfg();
  S.similarNote=pr;
  S.tab = pr.ageWindow==="new" ? "fresh" : "scan";
  if(pr.ageWindow==="new") runFresh(); else runScan();
}

// Saving several winners and hunting what they SHARE is far more meaningful
// than copying one. A single token is a sample of one — its FDV band could be
// coincidence. Traits that recur across three or four are at least a pattern.
function addHunt(p){
  if(!p||!p._cv)return;
  if(!Array.isArray(S.hunts))S.hunts=[];
  var pr=similarProfile(p);
  var sym=(p.baseToken&&p.baseToken.symbol)||"?";
  S.hunts.unshift({
    id:String(Date.now())+"-"+Math.random().toString(36).slice(2,9),
    sym:sym, addr:(p.baseToken&&p.baseToken.address)||"",
    chain:pr.chain, fdvLo:pr.fdvLo, fdvHi:pr.fdvHi,
    liqRatio:pr.liqRatio, ageWindow:pr.ageWindow,
    fdvAtSave:pr.fdv, ranAtSave:pr.alreadyRan, added:Date.now()
  });
  if(S.hunts.length>12)S.hunts.length=12;
  saveHunts();
  S.journalNote=sym+" saved. Save a few winners and hunt what they have in common.";
  render();
}
function removeHunt(id){ if(!Array.isArray(S.hunts))S.hunts=[];S.hunts=S.hunts.filter(function(x){return x.id!==id;}); saveHunts(); render(); }

// Build the overlap across every saved profile.
function compositeHunt(){
  if(!Array.isArray(S.hunts)||!S.hunts.length)return null;
  var chains={};
  S.hunts.forEach(function(x){chains[x.chain]=(chains[x.chain]||0)+1;});
  var topChain=Object.keys(chains).sort(function(a,b){return chains[b]-chains[a];})[0];
  var agree=chains[topChain];

  // Use the median band rather than the mean so one outlier can't drag it.
  var los=S.hunts.map(function(x){return x.fdvLo;}).sort(function(a,b){return a-b;});
  var his=S.hunts.map(function(x){return x.fdvHi;}).sort(function(a,b){return a-b;});
  var med=function(a){var m=Math.floor(a.length/2);
    return a.length%2?a[m]:(a[m-1]+a[m])/2;};
  var ratios=S.hunts.map(function(x){return x.liqRatio;}).filter(function(r){return r>0;}).sort(function(a,b){return a-b;});
  var newCount=S.hunts.filter(function(x){return x.ageWindow==="new";}).length;

  return {
    n:S.hunts.length,
    chain: agree>=Math.ceil(S.hunts.length/2) ? topChain : "all",
    chainAgree:agree,
    fdvLo:med(los), fdvHi:med(his),
    liqRatio: ratios.length?med(ratios):0,
    preferNew: newCount > S.hunts.length/2
  };
}

function applyComposite(){
  var c=compositeHunt(); if(!c)return;
  S.chain=c.chain;
  S.cfg.minLiqFloor=Math.max(4000,Math.round(c.fdvLo*Math.max(c.liqRatio,0.03)));
  S.cfg.freshMinLiq=Math.max(3000,Math.round(c.fdvLo*0.03));
  S.cfg.minVol=Math.max(3000,Math.round(c.fdvLo*0.05));
  if(c.preferNew){S.cfg.freshMaxAgeH=168;S.cfg.minAgeH=1;}
  saveCfg();
  S.similarNote={chain:c.chain,fdvLo:c.fdvLo,fdvHi:c.fdvHi,
    ageWindow:c.preferNew?"new":"established",alreadyRan:false,composite:c};
  S.tab=c.preferNew?"fresh":"scan";
  if(c.preferNew)runFresh(); else runScan();
}

// The plain answer to "is this safe to buy?" — stated first, before any
// scores or charts. Safety here means: no scam mechanics detected. It never
// means the price will rise, and it says so.
function safetyVerdictHTML(p){
  var g=p._gate, sec=p._sec||{}, dr=p._dump;
  if(!g)return "";
  var age=ageH(p.pairCreatedAt);
  var veryNew=age!=null&&age<6;

  var head,sub,col,icon;
  if(g.verdict==="block"){
    col="var(--red)"; icon="\u26d4"; head="NOT SAFE \u2014 DO NOT BUY";
    sub="A scam mechanic or disqualifying risk was detected. Specifics below.";
  } else if(g.verdict==="unverified"){
    col="#C8C8C8"; icon="\u2753"; head="CANNOT VERIFY YET";
    sub="No security provider has a record of this contract, which is normal for something this new. Nobody has checked it \u2014 including this app. Treat it as maximum risk.";
  } else if(dr&&dr.severe>=1){
    col="var(--amber)"; icon="\u26a0\ufe0f"; head="RISKY \u2014 PROCEED WITH CAUTION";
    sub="No scam mechanics found, but there are active warning signs listed below.";
  } else if(g.verdict==="caution"){
    col="var(--amber)"; icon="\u26a0\ufe0f"; head="NO SCAMS FOUND \u2014 SOME WARNINGS";
    sub="Every contract-safety check passed. The flags below are things to weigh, not scam mechanics.";
  } else {
    col="var(--frog)"; icon="\u2705"; head="NO SCAM MECHANICS FOUND";
    sub="Every safety check passed: you can sell, supply can't be inflated, liquidity is locked, and no one wallet controls it.";
  }

  var h='<div style="margin:16px 18px;border:2px solid '+col+';border-radius:13px;overflow:hidden">'+
    '<div style="padding:16px;background:rgba(255,255,255,.03)">'+
    '<div style="font-size:19px;font-weight:800;color:'+col+';line-height:1.3">'+icon+' '+head+'</div>'+
    '<div style="margin-top:9px;font-size:14.5px;line-height:1.65;color:var(--text2)">'+esc(sub)+'</div>';

  if(g.verdict==="block"&&g.blockers.length){
    h+='<div style="margin-top:12px;padding:11px;border-radius:9px;background:rgba(255,107,122,.1)">'+
      '<div style="font-size:12.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--red);font-weight:800">Why</div>';
    g.blockers.slice(0,5).forEach(function(b){
      h+='<div style="margin-top:6px;font-size:14px;color:#FFC2C9">\u2715 '+esc(b)+'</div>';});
    h+='</div>';
  }

  if(veryNew){
    h+='<div style="margin-top:12px;padding:11px;border-radius:9px;background:rgba(255,194,77,.09);'+
      'border:1px solid rgba(255,194,77,.3)">'+
      '<div style="font-size:14px;line-height:1.65;color:#FFE0A8">'+
      '<b>This is '+esc(ageLbl(age))+' old.</b> Early calls do sometimes go 2\u20135x \u2014 and the same '+
      'window is where nearly every rug happens, because the deployer can still pull liquidity and the '+
      'security databases have not indexed it yet.<br><br>'+
      'What the checks above <i>can</i> tell you: whether it is a honeypot, whether supply can be minted, '+
      'whether liquidity is locked, who holds what.<br>'+
      'What nothing can tell you: whether the team sells tomorrow.</div></div>';
  }

  // The honest limit, stated every time — a pass is not a prediction.
  h+='<div style="margin-top:12px;font-size:13.5px;line-height:1.65;color:var(--dim)">'+
    '<b style="color:var(--text2)">What "safe" means here:</b> no scam mechanics were detected. '+
    'It does not mean the price will rise. Clean tokens lose value every day \u2014 that is the normal '+
    'outcome for microcaps. Only risk what you can lose entirely.</div>';

  return h+'</div></div>';
}

var LEARN=[
  {q:"Liquidity", a:"The pool of money sitting on the exchange that lets people actually trade the token. If a pool holds $50,000, that is roughly what is available to buy from and sell into.<br><br><b>Why it matters most:</b> you can only get out through the liquidity. A token can show a wonderful price and still be impossible to sell if the pool is tiny. Liquidity leaving the pool is the clearest sign of a rug in progress."},

  {q:"Slippage", a:"The gap between the price you see and the price you actually get. Buying moves the price against you; the smaller the pool, the more it moves.<br><br>At your size this is usually tiny, but it is charged twice \u2014 once going in, once coming out. RibbitPad estimates the full round trip so nothing surprises you."},
  {q:"Honeypot", a:"A contract deliberately written so you can buy but cannot sell. Your wallet shows a balance and gains you can never realise.<br><br>GoPlus simulates a sell before you ever see the token, and anything flagged is blocked outright. This is the check that saves the most money, and no setting turns it off."},

  '<div class="field"><label>Max total cost (% of stake)</label><input id="cDrag" type="number" inputmode="decimal" value="'+c.maxFeeDragPct+'" />'+
  '<div class="hint">Blocks trades where fees + slippage + taxes exceed this share. At '+usd(c.sizeUsd)+' that caps total cost at '+usd(c.sizeUsd*c.maxFeeDragPct/100)+'. This is the single most important setting for small trades.</div></div>'+

  '<div class="field"><label>Liquidity needed per $1 of stake</label><input id="cLiqM" type="number" inputmode="decimal" value="'+c.liqMultiple+'" />'+
  '<div class="hint">Requires liquidity of at least stake × this. At '+usd(c.sizeUsd)+' × '+c.liqMultiple+' = '+compact(c.sizeUsd*c.liqMultiple)+' (floor '+compact(c.minLiqFloor)+').</div></div>'+

  '<div class="field"><label>Absolute liquidity floor</label><input id="cLiqF" type="number" inputmode="decimal" value="'+c.minLiqFloor+'" />'+
  '<div class="hint">Never go below this no matter how small the stake — very thin pools are manipulable regardless of your size.</div></div>'+

  '<div class="field"><label>Stop loss %</label><input id="cStop" type="number" inputmode="decimal" value="'+c.stopPct+'" />'+
  '<div class="hint">At '+c.stopPct+'% you risk '+usd(c.sizeUsd*c.stopPct/100)+'. Wider stops suit small stacks — a tight stop on a volatile microcap just pays fees twice.</div></div>'+

  '<div class="field"><label>Take-profit multiples</label><input id="cTp" value="'+c.tp.join(", ")+'" />'+
  '<div class="hint">Comma-separated, e.g. "2, 4, 10".</div></div>'+

  '<div class="field"><label>Max buy / sell tax %</label><div class="row2">'+
  '<input id="cBuyTax" type="number" inputmode="decimal" value="'+c.maxBuyTax+'" />'+
  '<input id="cSellTax" type="number" inputmode="decimal" value="'+c.maxSellTax+'" /></div></div>'+

  '<div class="field"><label>Max deployer holding %</label><input id="cCreator" type="number" inputmode="decimal" value="'+c.maxCreatorPct+'" />'+
  '<div class="hint">Blocks tokens where the wallet that launched it still holds more than this. The deployer is the one person who can always dump on you.</div></div>'+

  '<div class="field"><label>Max top-10 holder %</label><input id="cTop10" type="number" inputmode="decimal" value="'+c.maxTop10+'" /></div>'+

  '<div class="field"><label>Min 24h volume</label><input id="cVol" type="number" inputmode="decimal" value="'+c.minVol+'" /></div>'+

  '<div class="field"><label>Max open positions</label><input id="cMaxPos" type="number" inputmode="decimal" value="'+c.maxOpenPositions+'" />'+
  '<div class="hint">More positions than you can watch usually means missed exits.</div></div>'+

  '<div class="field"><label>Max money deployed at once</label><input id="cMaxExp" type="number" inputmode="decimal" value="'+c.maxExposureUsd+'" />'+
  '<div class="hint">Total across all open positions. At '+usd(c.sizeUsd)+' per trade that is '+
  Math.floor(c.maxExposureUsd/Math.max(c.sizeUsd,1))+' positions.</div></div>'+

  '<div class="field"><label>Daily loss limit</label><input id="cDayLoss" type="number" inputmode="decimal" value="'+c.dailyLossLimit+'" />'+
  '<div class="hint">Warns you when 24h realised losses pass this. Chasing losses is the most reliable way to turn a bad day into a bad month.</div></div>'+

  '<div class="tog"><div><div class="t">Live prices</div><div class="s">Refresh prices on screen every '+
  c.liveIntervalSec+'s. Requests are batched into one call per chain, and polling pauses when the tab '+
  'is in the background.</div></div><div class="sw'+(c.liveEnabled?" on":"")+'" id="swLive"><i></i></div></div>'+

  '<div class="field"><label>Live refresh (seconds)</label><input id="cLiveSec" type="number" inputmode="decimal" value="'+c.liveIntervalSec+'" />'+
  '<div class="hint">Minimum 3. Faster is not necessarily better \u2014 the underlying data updates '+
  'roughly every few seconds anyway, and tighter polling risks hitting the free rate limit.</div></div>'+

  '<div class="field"><label>Simulated wallet starting balance</label><input id="cStart" type="number" inputmode="decimal" value="'+c.startBalance+'" />'+
  '<div class="hint">What the paper wallet begins with. At '+usd(c.sizeUsd)+' per trade that is '+
  Math.floor(c.startBalance/Math.max(c.sizeUsd,1))+' positions before it is fully deployed.</div></div>'+

  '<div class="field"><label>Heat threshold</label><input id="cHeat" type="number" inputmode="decimal" value="'+c.heatThreshold+'" />'+
  '<div class="hint">Minimum build score for the Heat tab (0\u2013100). Lower shows more, earlier and noisier; higher shows only strong build-ups.</div></div>'+

  '<div class="field"><label>New-launch window (hours)</label><div class="row2">'+
  '<input id="cFreshMin" type="number" inputmode="decimal" step="0.5" value="'+c.freshMinAgeH+'" />'+
  '<input id="cFreshMax" type="number" inputmode="decimal" value="'+c.freshMaxAgeH+'" /></div>'+
  '<div class="hint">Age range for the <b>New</b> tab. Currently '+c.freshMinAgeH+'h to '+c.freshMaxAgeH+'h old. Under 30 minutes is usually unindexed by security providers, so it will just get blocked.</div></div>'+

  '<div class="field"><label>New-launch minimum liquidity</label><input id="cFreshLiq" type="number" inputmode="decimal" value="'+c.freshMinLiq+'" />'+
  '<div class="hint">Lower than the main scan since new pairs start small. Below ~$3K is rarely exitable.</div></div>'+

  '<div class="field"><label>Min / max pair age (hours)</label><div class="row2">'+
  '<input id="cMinAge" type="number" inputmode="decimal" value="'+c.minAgeH+'" />'+
  '<input id="cMaxAge" type="number" inputmode="decimal" value="'+c.maxAgeH+'" /></div></div>'+

  '<div class="toolbar"><button class="primary" id="saveCfg">Save settings</button></div>'+

  '<div class="banner warn"><b>The honest maths of small trades.</b> On a '+usd(c.sizeUsd)+' stake, a 2x nets you about '+
  usd(c.sizeUsd)+' before costs. Solana or Base leave nearly all of that; Ethereum would take most of it. Trading small is a fine way to learn with money you can lose — just don\u2019t expect it to compound into much, and never let the size tempt you into skipping the audit.</div>';
}

    '<div class="pane '+(S.tab==="fresh"?"on":"")+'">'+(S.tab==="fresh"?freshPane():"")+'</div>'+
    '<div class="pane '+(S.tab==="watch"?"on":"")+'">'+(S.tab==="watch"?watchPane():"")+'</div>'+
    '<div class="pane '+(S.tab==="journal"?"on":"")+'">'+(S.tab==="journal"?journalPane():"")+'</div>'+
    '<div class="pane '+(S.tab==="lookup"?"on":"")+'">'+(S.tab==="lookup"?lookupPane():"")+'</div>'+
    '<div class="pane '+(S.tab==="cfg"?"on":"")+'">'+(S.tab==="cfg"?cfgPane():"")+'</div>';

  Array.prototype.forEach.call(app.querySelectorAll(".tabs button"),function(b){
    b.onclick=function(){S.tab=b.getAttribute("data-tab");render();};});
  Array.prototype.forEach.call(app.querySelectorAll("[data-chain]"),function(b){
    b.onclick=function(){S.chain=b.getAttribute("data-chain");render();};});

    b.onclick=function(){S.cfg.minGrade=b.getAttribute("data-grade");render();};});
  Array.prototype.forEach.call(app.querySelectorAll("[data-copy]"),function(b){
    b.onclick=function(){copyCA(b.getAttribute("data-copy"),b);};});
  Array.prototype.forEach.call(app.querySelectorAll("[data-stake]"),function(b){
    b.onclick=function(){
      S.cfg.sizeUsd=parseFloat(b.getAttribute("data-stake"));saveCfg();
      // recompute economics for everything already scanned
      S.passed.concat(S.blocked).forEach(function(p){
        p._econ=tradeEconomics(p,p._sec);
        p._gate=gate(p,p._sec,p._econ);
        if(p._gate.verdict!=="block")p._cv=conviction(p,p._sec,p._econ);
      });
      var all=S.passed.concat(S.blocked);
      S.passed=all.filter(function(p){return p._gate.verdict!=="block";});
      S.blocked=all.filter(function(p){return p._gate.verdict==="block";});
      S.passed.forEach(function(p){if(!p._cv)p._cv=conviction(p,p._sec,p._econ);});
      S.passed.sort(function(a,b){return b._cv.total-a._cv.total;});
      render();
    };});

  // keep the feed aligned with what's on screen
  if(S.cfg.liveEnabled&&!IS_LOCAL_FILE){ if(!LIVE.running)startLive(); else liveTick(); }
  else stopLive();

  var ol=document.getElementById("openLearn");
  if(ol)ol.onclick=function(){S.showLearn=true;render();};
  var bs=document.getElementById("backSettings");
  if(bs)bs.onclick=function(){S.showLearn=false;render();};
  Array.prototype.forEach.call(app.querySelectorAll("[data-learnjump]"),function(b){
    b.onclick=function(){
      var i=b.getAttribute("data-learnjump");
      S.learnOpen={}; S.learnOpen[i]=true;
      S.showLearn=true; S.tab="cfg"; render();
    };});
  Array.prototype.forEach.call(app.querySelectorAll("[data-learn]"),function(b){
    b.onclick=function(){var i=b.getAttribute("data-learn");
      S.learnOpen[i]=!S.learnOpen[i];render();};});

  var lt=document.getElementById("liveToggle");
  if(lt)lt.onclick=function(){S.cfg.liveEnabled=!S.cfg.liveEnabled;saveCfg();restartLive();render();};

  var r=document.getElementById("refresh");if(r)r.onclick=runScan;
  var di=document.getElementById("dismissIntro");
  if(di)di.onclick=function(){S.seenIntro=true;S.cfg.seenIntro=true;saveCfg();render();};
  var fb=document.getElementById("freshBtn");if(fb)fb.onclick=runFresh;
  var hb=document.getElementById("heatBtn");if(hb)hb.onclick=runHeat;
  var sT=document.getElementById("sortToggle");
  if(sT)sT.onclick=function(){
    S.cfg.freshSortBySurge=!(S.cfg.freshSortBySurge!==false);saveCfg();
    if(S.cfg.freshSortBySurge)S.fresh.sort(function(a,b){return (b._surgeScore||0)-(a._surgeScore||0);});
    else S.fresh.sort(function(a,b){return num(b.pairCreatedAt)-num(a.pairCreatedAt);});
    render();
  };

  var wa=document.getElementById("watchAdd"),wi=document.getElementById("watchIn");
  if(wa)wa.onclick=function(){addWatch(wi?wi.value:"");};
  if(wi)wi.onkeydown=function(e){if(e.key==="Enter")addWatch(wi.value);};
  var wr=document.getElementById("watchRef");if(wr)wr.onclick=refreshWatch;
  Array.prototype.forEach.call(app.querySelectorAll("[data-unwatch]"),function(b){
    b.onclick=function(){removeWatch(b.getAttribute("data-unwatch"));};});

  var tr=document.getElementById("trRef");if(tr)tr.onclick=refreshTrades;
  var wt=document.getElementById("watchToggle");
  if(wt)wt.onclick=function(){S.watching?stopWatching():startWatching();};
  var nb=document.getElementById("notifBtn");if(nb)nb.onclick=requestNotify;
  var tc=document.getElementById("trCsv");if(tc)tc.onclick=exportTradesCSV;
  var al=document.getElementById("applyLadder");
  if(al)al.onclick=function(){
    var tp=(al.getAttribute("data-tp")||"").split(",").map(Number).filter(function(x){return isFinite(x)&&x>1;});
    if(!tp.length)return;
    S.cfg.tp=tp; saveCfg();
    S.journalNote="Exit ladder set to "+tp.map(function(m){return m+"x";}).join(" / ")+
      ". This applies to new trades \u2014 open ones keep the plan they started with.";
    render();
  };
  var ss=document.getElementById("showStats");
  if(ss)ss.onclick=function(){S.showStats=true;render();};
  var bj=document.getElementById("backJournal");
  if(bj)bj.onclick=function(){S.showStats=false;render();};
  Array.prototype.forEach.call(app.querySelectorAll("[data-log]"),function(b){
    b.onclick=function(){
      S.logPrompt={addr:b.getAttribute("data-log")};
      render();
    };});
  Array.prototype.forEach.call(app.querySelectorAll("[data-logcancel]"),function(b){
    b.onclick=function(){S.logPrompt=null;render();};});
  Array.prototype.forEach.call(app.querySelectorAll("[data-logmode]"),function(b){
    b.onclick=function(){
      if(!S.logPrompt)return;
      S.logPrompt.real=(b.getAttribute("data-logmode")==="real");
      render();
    };});
  Array.prototype.forEach.call(app.querySelectorAll("[data-logconfirm]"),function(b){
    b.onclick=function(){
      var addr=b.getAttribute("data-logconfirm");
      // Scope the inputs to this address: the same token can appear in both
      // Top Picks and the list, so a shared element id would be ambiguous.
      var pxEl=app.querySelector('.logPxIn[data-px="'+addr+'"]');
      var szEl=app.querySelector('.logSzIn[data-sz="'+addr+'"]');
      var pv=pxEl?parseFloat(pxEl.value):NaN, sv=szEl?parseFloat(szEl.value):NaN;
      // If the field somehow isn't reachable, fall back to the live price
      // rather than refusing to record the trade.
      if(!isFinite(pv)||pv<=0){
        var lp=(LIVE.prices[Object.keys(LIVE.prices).filter(function(k){
          return k.indexOf(":"+addr.toLowerCase())>0;})[0]]||{}).px;
        if(lp)pv=lp;
      }
      if(!isFinite(sv)||sv<=0) sv=S.cfg.sizeUsd;
      if(!isFinite(pv)||pv<=0){S.journalNote="Enter the price you paid \u2014 it can't be blank or zero.";render();return;}
      if(!isFinite(sv)||sv<=0){S.journalNote="Enter how much you spent.";render();return;}
      var pool=S.passed.concat(S.unverified,S.heat,S.heatUnverified,S.fresh,S.freshUnverified);
      Object.keys(S.watchData).forEach(function(k){var d=S.watchData[k];if(d&&!d._err)pool.push(d);});
      if(S.lookup)pool.push(S.lookup);
      for(var i=0;i<pool.length;i++){
        var p=pool[i];
        if(((p.baseToken&&p.baseToken.address)||"")===addr){
          // blocked/unverified tokens are always paper, whatever the toggle says
          var forced=b.getAttribute("data-forcepaper")==="1";
          var isReal=!forced&&!!(S.logPrompt&&S.logPrompt.real);
          logTrade(p,pv,sv,!isReal);
          S.logPrompt=null;
          S.journalNote=(isReal?"Logged ":"Paper trade started on ")+
            ((p.baseToken&&p.baseToken.symbol)||"trade")+" at "+px(pv)+" for "+usd(sv)+
            (isReal?". Open the Log tab to track it."
                  :". It will sell at your targets and exit at your stop automatically \u2014 check the Log tab.");
          render();
          return;
        }
      }
      S.logPrompt=null;
      S.journalNote="Couldn't find that token to log \u2014 try scanning again.";
      render();
    };});
  Array.prototype.forEach.call(app.querySelectorAll("[data-saveentry]"),function(b){
    b.onclick=function(){
      var id=b.getAttribute("data-saveentry");
      var t=null; S.trades.forEach(function(x){if(x.id===id)t=x;});
      if(!t)return;
      var eIn=app.querySelector('.entryIn[data-entry="'+id+'"]');
      var sIn=app.querySelector('.sizeIn[data-size="'+id+'"]');
      var ev=eIn?parseFloat(eIn.value):NaN, sv=sIn?parseFloat(sIn.value):NaN;

      if(isFinite(sv)&&sv>0)t.size=sv;

      render();

  Array.prototype.forEach.call(app.querySelectorAll("[data-close]"),function(b){

      closeTrade(id,inp?inp.value:0);
    };});
  Array.prototype.forEach.call(app.querySelectorAll("[data-del]"),function(b){

  var va=document.getElementById("walAdd"),vi=document.getElementById("walIn");
  if(va)va.onclick=function(){addWallet(vi?vi.value:"");};

  Array.prototype.forEach.call(app.querySelectorAll("[data-expand]"),function(b){
    b.onclick=function(){var k=b.getAttribute("data-expand");
      S.expanded[k]=!S.expanded[k];render();};});
  Array.prototype.forEach.call(app.querySelectorAll("[data-trackdev]"),function(b){
    b.onclick=function(){addWallet(b.getAttribute("data-trackdev"));

  Array.prototype.forEach.call(app.querySelectorAll("[data-unwallet]"),function(b){

  var rb=document.getElementById("relaxBtn");
  if(rb)rb.onclick=function(){applyRelax(rb.getAttribute("data-relax"));runScan();};
  var fs=document.getElementById("findSimilar");
  if(fs)fs.onclick=function(){applySimilar(S.lookup);};

  var rc=document.getElementById("runComposite");
  if(rc)rc.onclick=applyComposite;
  Array.prototype.forEach.call(app.querySelectorAll("[data-unhunt]"),function(b){
    b.onclick=function(){removeHunt(b.getAttribute("data-unhunt"));};});
  Array.prototype.forEach.call(app.querySelectorAll("[data-hunt]"),function(b){
    b.onclick=function(){
      var id=b.getAttribute("data-hunt");
      var x=S.hunts.filter(function(y){return y.id===id;})[0];
      if(!x)return;
      S.chain=x.chain;
      S.cfg.minLiqFloor=Math.max(4000,Math.round(x.fdvLo*Math.max(x.liqRatio,0.03)));
      S.cfg.freshMinLiq=Math.max(3000,Math.round(x.fdvLo*0.03));
      S.cfg.minVol=Math.max(3000,Math.round(x.fdvLo*0.05));
      saveCfg();
      S.similarNote={chain:x.chain,fdvLo:x.fdvLo,fdvHi:x.fdvHi,
        ageWindow:x.ageWindow,alreadyRan:x.ranAtSave,ch24:0,fdv:x.fdvAtSave};
      S.tab=x.ageWindow==="new"?"fresh":"scan";
      if(x.ageWindow==="new")runFresh(); else runScan();
    };});
  var dl=document.getElementById("doLookup");
  if(dl)dl.onclick=function(){var e=document.getElementById("caInput");
    S.lastQuery=e?e.value:"";lookupOne(S.lastQuery);};
  var ci=document.getElementById("caInput");
  if(ci)ci.onkeydown=function(e){if(e.key==="Enter"){S.lastQuery=ci.value;lookupOne(ci.value);}};

  function bind(id,k){var el=document.getElementById(id);
    if(el)el.onclick=function(){S.cfg[k]=!S.cfg[k];saveCfg();render();};}
  bind("swStrict","strict");bind("swLp","requireLpLock");bind("swHide","hideBlocked");bind("swPers","personalise");bind("swAdapt","adaptWeights");
  var swL=document.getElementById("swLive");
  if(swL)swL.onclick=function(){S.cfg.liveEnabled=!S.cfg.liveEnabled;saveCfg();restartLive();render();};

  var sv=document.getElementById("saveCfg");
  if(sv)sv.onclick=function(){
    function gv(id,d,min){var e=document.getElementById(id);var v=e?parseFloat(e.value):NaN;
      return isFinite(v)&&v>=(min===undefined?0:min)?v:d;}
    var c=S.cfg;
    c.auditLimit=Math.min(200,Math.max(10,gv("cAudit",c.auditLimit,10)));
    c.maxCreatorPct=Math.max(1,gv("cCreator",c.maxCreatorPct,1));
    c.maxOpenPositions=Math.max(1,gv("cMaxPos",c.maxOpenPositions,1));
    c.maxExposureUsd=Math.max(1,gv("cMaxExp",c.maxExposureUsd,1));
    c.dailyLossLimit=Math.max(1,gv("cDayLoss",c.dailyLossLimit,1));
    c.heatThreshold=Math.max(0,Math.min(100,gv("cHeat",c.heatThreshold,0)));
    c.startBalance=Math.max(1,gv("cStart",c.startBalance,1));
    c.liveIntervalSec=Math.max(3,gv("cLiveSec",c.liveIntervalSec,3));
    c.freshMinAgeH=gv("cFreshMin",c.freshMinAgeH);
    c.freshMaxAgeH=Math.max(1,gv("cFreshMax",c.freshMaxAgeH,1));
    c.freshMinLiq=gv("cFreshLiq",c.freshMinLiq);
    c.maxFeeDragPct=gv("cDrag",c.maxFeeDragPct,0.5);
    c.liqMultiple=gv("cLiqM",c.liqMultiple,1);
    c.minLiqFloor=gv("cLiqF",c.minLiqFloor,0);
    c.stopPct=Math.min(95,gv("cStop",c.stopPct,1));
    c.maxBuyTax=gv("cBuyTax",c.maxBuyTax);c.maxSellTax=gv("cSellTax",c.maxSellTax);
    c.maxTop10=gv("cTop10",c.maxTop10,1);c.minVol=gv("cVol",c.minVol);
    c.minAgeH=gv("cMinAge",c.minAgeH);c.maxAgeH=gv("cMaxAge",c.maxAgeH,1);
    var t=document.getElementById("cTp");
    if(t){var pr=t.value.split(",").map(function(x){return parseFloat(x.trim());})
      .filter(function(x){return isFinite(x)&&x>1;});if(pr.length)c.tp=pr;}
    saveCfg();
    S.tab="scan";restartLive();render();
  };
}

window.onerror=function(m,s,l,c,err){
  var a=document.getElementById("app");
  if(a)a.innerHTML='<div class="banner err code">Startup error:\n\n'+esc((err&&err.stack)||m)+'</div>';
};

render();
})();
</script>
